<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grey Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --hud: rgba(26, 29, 21, 0.94);
    --hud-edge: #3a3f2f;
    --ink: #e8e4d4;
    --ink-dim: #a3a08d;
    --ua: #3a86ff;
    --ua-accent: #ffd60a;
    --ru: #c1121f;
    --ok: #8bc34a;
    --warn: #e0a030;
    --c-barracks: #b8b06a;
    --c-drone: #ffd60a;
    --c-armor: #8fb3ff;
    --c-arty: #f08a5d;
    --c-aa: #7fd1b9;
    --c-ew: #c48be0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3124; color: var(--ink);
    font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #top { height: 46px; display: flex; align-items: center; gap: 26px; padding: 0 16px; background: var(--hud);
    border-bottom: 1px solid var(--hud-edge); }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat .lbl { color: var(--ink-dim); }
  .stat .val { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.01em; }
  #depots { display: inline-flex; gap: 5px; align-items: center; }
  #depots, .sq { display: inline-flex; gap: 5px; align-items: center; }
  #depots i, .sq i { display: inline-block; width: 14px; height: 14px; border: 1px solid #000; background: #6b6b60; }
  #depots i.ua, .sq i.ua { background: var(--ua); }
  #depots i.ru, .sq i.ru { background: var(--ru); }
  .sq i.fire { background: #e0552b; }
  .sq i.cut { background: repeating-linear-gradient(45deg, var(--ua), var(--ua) 3px, #000 3px, #000 5px); }
  #top .spacer { flex: 1; }
  #top button, #bottom button, #overlay button { font: inherit; color: var(--ink); background: #2f3527; border: 1px solid #4a5140;
    padding: 5px 11px; cursor: pointer; }
  #top button:hover, #bottom button:hover, #overlay button:hover { background: #3b4331; }
  #top a.btn { font: inherit; color: var(--ink); background: #2f3527; border: 1px solid #4a5140; padding: 5px 11px; text-decoration: none; }
  #top a.btn:hover { background: #3b4331; }
  #overlay a { color: #9fd6e8; }
  #top button:focus-visible, #bottom button:focus-visible, #overlay button:focus-visible { outline: 2px solid var(--ua-accent); outline-offset: 1px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #game { display: block; width: 100%; height: 100%; cursor: crosshair; position: relative; }
  #msg { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); pointer-events: none;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 500; color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 12px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.25s; }
  #msg.show { opacity: 1; }
  #bottom { height: 188px; display: flex; background: var(--hud); border-top: 1px solid var(--hud-edge); }
  #selpanel { width: 250px; padding: 10px 14px; border-right: 1px solid var(--hud-edge); overflow: hidden; }
  #selpanel h3, #cmdpanel h3 { margin: 0 0 6px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600;
    font-size: 20px; }
  #selpanel .row { display: flex; justify-content: space-between; color: var(--ink-dim); margin: 2px 0; }
  #selpanel .row b { color: var(--ink); font-weight: 500; }
  .hpbar { height: 6px; background: #1a1d16; border: 1px solid #000; margin: 6px 0 8px; }
  .hpbar i { display: block; height: 100%; background: var(--ok); }
  #cmdpanel { flex: 1; padding: 8px 14px; display: flex; flex-direction: column; min-width: 0; }
  #tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  #tabs button { padding: 3px 12px; background: transparent; border-color: transparent; color: var(--ink-dim); }
  #tabs button.on { color: var(--ink); border-bottom: 2px solid var(--ua-accent); }
  #cmdbody { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; align-content: flex-start; overflow: hidden; }
  .cmd { position: relative; width: 176px; height: 60px; text-align: left; padding: 6px 10px 6px 14px !important; border-left-width: 4px !important;
    display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .cmd .name { font-weight: 500; line-height: 1.1; }
  .cmd .meta { color: var(--ink-dim); font-size: 12px; display: flex; justify-content: space-between; }
  .cmd .key { position: absolute; top: 4px; right: 7px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: var(--ink-dim); }
  .cmd:disabled { opacity: 0.45; cursor: default; }
  .cmd .tag { color: #ff8a80; }
  #selpanel .strike { margin-top: 6px; width: 100%; border-color: #7a3030; }
  #selpanel .forms { display: flex; gap: 4px; margin-top: 6px; }
  #selpanel .forms button { flex: 1; padding: 3px 0; font-size: 12px; background: transparent; }
  #selpanel .forms button.on { border-color: var(--ua-accent); color: var(--ua-accent); }
  .cmd.owned { border-color: var(--ok); border-left-color: var(--ok) !important; }
  .cmd.barracks { border-left-color: var(--c-barracks) !important; }
  .cmd.droneWorks { border-left-color: var(--c-drone) !important; }
  .cmd.armorPlant { border-left-color: var(--c-armor) !important; }
  .cmd.artyDepot { border-left-color: var(--c-arty) !important; }
  .cmd.launchSite { border-left-color: #9fd6e8 !important; }
  .cmd.aidPost { border-left-color: #8bc34a !important; }
  .cmd.generator { border-left-color: #ffd60a !important; }
  .cmd.radar { border-left-color: var(--c-aa) !important; }
  .cmd.ewStation { border-left-color: var(--c-ew) !important; }
  #queue { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; min-height: 26px; width: 100%; }
  #queue .q { width: 30px; height: 24px; background: #2f3527; border: 1px solid #4a5140; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; }
  #queue .q i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ua-accent); }
  #queue .hint { color: var(--ink-dim); font-size: 12px; margin-left: auto; }
  #queue .heat { width: 80px; height: 8px; background: #1a1d16; border: 1px solid #000; margin-left: auto; }
  #queue .heat i { display: block; height: 100%; }
  #mapwrap { width: 282px; padding: 6px 10px; border-left: 1px solid var(--hud-edge); display: flex; align-items: center; justify-content: center; }
  #minimap { display: block; border: 1px solid #000; cursor: pointer; }
  #overlay { position: absolute; inset: 0; background: rgba(14, 17, 11, 0.86); display: flex; align-items: center; justify-content: center;
    overflow: auto; }
  #overlay .card { width: min(720px, 92vw); background: var(--hud); border: 1px solid var(--hud-edge); padding: 28px 34px 30px; }
  #overlay h1 { margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 54px; line-height: 1;
    letter-spacing: 0.005em; }
  #overlay h1 span { color: var(--ua-accent); }
  #overlay .sub { color: var(--ink-dim); margin: 8px 0 20px; max-width: 60ch; }
  #overlay .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  #overlay h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; margin: 0 0 6px; }
  #overlay p, #overlay li { margin: 0 0 6px; line-height: 1.4; max-width: 46ch; }
  #overlay ul { padding-left: 18px; margin: 0; }
  #overlay kbd { font: inherit; background: #2f3527; border: 1px solid #4a5140; padding: 0 5px; }
  #legend { width: 100%; height: 260px; display: block; margin-top: 4px; }
  #diff { display: flex; gap: 8px; margin-top: 22px; align-items: center; }
  #diff button.on { border-color: var(--ua-accent); }
  #diff .go { margin-left: auto; background: var(--ua); border-color: var(--ua); color: #fff; padding: 8px 18px; font-weight: 500; }
  #diff .go:hover { background: #2a6fe0; }
  #overlay .result { font-size: 18px; margin: 6px 0 14px; }
  #overlay .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  #overlay .stats div { border-left: 3px solid var(--hud-edge); padding-left: 10px; }
  #overlay .stats b { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 26px; }
  #overlay .stats span { color: var(--ink-dim); }
  #legendpanel { position: absolute; right: 12px; top: 12px; width: 340px; background: var(--hud); border: 1px solid var(--hud-edge);
    padding: 10px 12px; display: none; }
  #legendpanel.show { display: block; }
  #legendpanel canvas { width: 100%; height: 340px; display: block; }
  #techpanel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1180px, 96%); max-height: 90%; overflow: auto; background: var(--hud); border: 1px solid var(--hud-edge); padding: 14px 16px; display: none; }
  #techpanel.show { display: block; }
  #techHead { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
  #techHead h3 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; }
  #techHead span { color: var(--ink-dim); }
  #techHead button { margin-left: auto; }
  #techGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .branch h4 { margin: 0 0 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; color: var(--ua-accent); }
  .tech { width: 100%; text-align: left; padding: 7px 9px !important; margin-bottom: 4px; position: relative; display: block; }
  .tech .n { font-weight: 500; }
  .tech .d { color: var(--ink-dim); font-size: 12px; line-height: 1.3; margin-top: 2px; }
  .tech .c { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; margin-top: 3px; }
  .tech.owned { border-color: var(--ok); }
  .tech.owned .c { color: var(--ok); }
  .tech.locked { opacity: 0.45; }
  .tech.avail { border-color: var(--ua-accent); }
  .link { width: 2px; height: 10px; background: var(--hud-edge); margin: 0 0 4px 16px; }
  #manual { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1100px, 96%); height: 88%; background: var(--hud); border: 1px solid var(--hud-edge); padding: 14px 18px; display: none; flex-direction: column; }
  #manual.show { display: flex; }
  #manualHead { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  #manualHead h3 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; }
  #manualTabs { display: flex; gap: 4px; }
  #manualTabs button { padding: 3px 10px; background: transparent; border-color: transparent; color: var(--ink-dim); }
  #manualTabs button.on { color: var(--ink); border-bottom: 2px solid var(--ua-accent); }
  #manualHead > a { margin-left: auto; font-size: 13px; }
  #manualHead > button { margin-left: 8px; }
  #manualBody { flex: 1; overflow: auto; line-height: 1.45; }
  #manualBody h4 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; margin: 14px 0 6px; color: var(--ua-accent); }
  #manualBody p { margin: 0 0 8px; max-width: 90ch; }
  .uentry { display: grid; grid-template-columns: 220px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hud-edge); }
  .uentry .un { font-weight: 500; }
  .uentry .us { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
  #tut { position: absolute; left: 12px; top: 70px; width: 340px; background: var(--hud); border: 1px solid var(--hud-edge); border-left: 4px solid var(--ua-accent); padding: 10px 12px; display: none; }
  #tut.show { display: block; }
  #tutHead { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
  #tutStep { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: var(--ua-accent); }
  #tutTitle { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; }
  #tutText { line-height: 1.4; }
  #tutBtns { display: flex; gap: 6px; margin-top: 8px; }
  #tutBtns button { padding: 3px 9px; font-size: 12px; }
  #paused { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-family: 'Barlow Condensed', sans-serif;
    font-size: 40px; font-weight: 600; color: #fff; text-shadow: 0 2px 6px #000; display: none; pointer-events: none; }
  #paused.show { display: block; }
  @media (max-width: 900px) {
    #selpanel { width: 170px; }
    #overlay .cols { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { #msg { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat"><span class="lbl">Funds</span><span class="val" id="funds">0</span></div>
    <div class="stat"><span class="lbl">Income</span><span class="val" id="income">+0/s</span></div>
    <div class="stat"><span class="lbl">Towns</span><span id="depots"></span></div>
    <div class="stat"><span class="lbl">Gas</span><span id="gas" class="sq"></span><span class="val" id="gasflow" style="font-size:16px"></span></div>
    <div class="stat"><span class="lbl">Wheat</span><span id="wheat" class="sq"></span></div>
    <div class="stat"><span class="lbl">Forces</span><span class="val" id="forces">0</span></div>
    <div class="stat"><span class="lbl">Personnel</span><span class="val" id="people">0</span></div>
    <div class="stat"><span class="lbl">Operator slots</span><span class="val" id="slots">0</span></div>
    <div class="stat" id="supwrap"><span class="lbl">Support</span><span class="val" id="support">100%</span></div>
    <div class="stat" id="civwrap"><span class="lbl">Civilian sites</span><span class="val" id="civsites">0</span></div>
    <div class="stat"><span class="lbl">Trade</span><span class="val" id="trade">0</span></div>
    <div class="stat"><span class="lbl">Supply</span><span class="val" id="supplyEl" style="font-size:16px"></span></div>
    <div class="spacer"></div>
    <div class="stat"><span class="val" id="clock">00:00</span></div>
    <button id="basemapBtn" type="button" title="Cycle the background: drawn terrain, street map tiles, satellite imagery">Map: drawn</button>
    <button id="manualBtn" type="button" title="Every unit, building, and the strategy behind them">Manual</button>
    <button id="legendBtn" type="button">Legend</button>
    <button id="pauseBtn" type="button">Pause</button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="msg"></div>
    <div id="paused">Paused</div>
    <div id="legendpanel"><canvas id="legend2"></canvas></div>
    <div id="techpanel"><div id="techHead"><h3>Research and procurement</h3><span id="techFunds"></span><button id="techClose" type="button">Close (T)</button></div><div id="techGrid"></div></div>
    <div id="manual"><div id="manualHead"><h3>Field manual</h3><div id="manualTabs"></div><a href="grey-zone-manual.html" target="_blank" rel="noopener" class="btn" style="color:#9fd6e8">Full page</a><button id="manualClose" type="button">Close (M)</button></div><div id="manualBody"></div></div>
    <div id="tut"><div id="tutHead"><span id="tutStep"></span><span id="tutTitle"></span></div><div id="tutText"></div><div id="tutBtns"><button id="tutSkip" type="button">Skip step</button><button id="tutEnd" type="button">End tutorial</button></div></div>

    <div id="selpanel"></div>

      <div id="tabs"></div>

</div>
<script>
'use strict';

// ---------------------------------------------------------------- data
const W = 3600, H = 2110, H_LAND = 2110, DT = 1 / 60, MM_W = 260, MM_H = 152;
const UA = 0, RU = 1;
let PL = 0, EN = 1; // the side the player controls and the bot's side
const TEAMS = [
  { name: 'Ukraine', color: '#3a86ff', stroke: '#ffd60a', dark: '#1f3d78', hud: '#3a86ff' },
  { name: 'Russia',  color: '#c1121f', stroke: '#2e2e2e', dark: '#5a1418', hud: '#c1121f' },
];

const UNITS = {
  infantry: { label: ['Infantry squad', 'Infantry squad'], shape: 'circle', r: 7, hp: 70, speed: 42, roadMul: 1.3, range: 95, dmg: 7, rof: 0.55,
    cost: 180, crew: 6, time: 12, factory: 'barracks', vision: 170, canCapture: true, operator: true, troop: true, targets: ['inf', 'veh', 'struct'], vsStruct: 0.3, vsVehicle: 0.25,
    blurb: 'Holds ground and captures towns. Rifles barely scratch armor or buildings, and FPVs eat squads alive.' },
  dprk: { label: ['North Korean infantry', 'North Korean infantry'], shape: 'dprk', r: 7, hp: 90, speed: 42, roadMul: 1.3, range: 95, dmg: 9, rof: 0.5,
    cost: 100, crew: 0, time: 12, factory: 'barracks', vision: 160, canCapture: true, troop: true, targets: ['inf', 'veh', 'struct'], vsStruct: 0.3, vsVehicle: 0.25,
    morale: true, moraleLoss: 0.8, side: 1, cap: 10,
    blurb: 'Korean People\'s Army infantry, as sent to Kursk in 2024: fit, disciplined, hard-hitting, and new to drones. They come from Pyongyang, not your pool, at most ten squads. Morale falls when their side is losing, when they take fire, and when friends die nearby; below 30% they fall back, at 0% the squad is gone.' },
  merc: { label: ['International Legion squad', 'Mercenary assault squad'], shape: 'merc', r: 7, hp: 100, speed: 60, roadMul: 1.4, range: 100, dmg: 11, rof: 0.5,
    cost: 260, crew: 0, time: 10, factory: 'barracks', vision: 190, canCapture: true, troop: true, targets: ['inf', 'veh', 'struct'], vsStruct: 0.3, vsVehicle: 0.3,
    morale: true, moraleLoss: 0.6, upkeep: 2, cap: 6,
    blurb: 'Foreign fighters: experienced, fast, and well armed, but they fight for pay and for a winning side. Each squad costs 2 funds a second in wages; miss the pay or start losing towns and morale drops, below 30% they stop taking orders and fall back, at 0% they leave.' },
  fireGroup: { label: ['Mobile fire group', 'Mobile fire group'], shape: 'gun', r: 7, hp: 60, speed: 40, roadMul: 1.5, range: 130, dmg: 16, rof: 0.35,
    cost: 140, crew: 3, time: 10, factory: 'barracks', vision: 200, troop: true, targets: ['air'], lowAlt: true,
    blurb: 'Machine guns and shotguns on a pickup. Shoots down drones and nothing else. Park them over trucks and towns.' },
  moto: { label: ['Motorcycle assault group', 'Motorcycle assault group'], shape: 'moto', r: 7, hp: 40, speed: 105, roadMul: 1.8, range: 70, dmg: 6, rof: 0.4,
    cost: 130, crew: 3, time: 8, factory: 'barracks', vision: 160, canCapture: true, troop: true, targets: ['inf', 'struct'], vsStruct: 0.2,
    blurb: 'Fast and fragile. Rushes through the kill zone to grab a town before the drones react.' },
  fpv: { label: ['FPV quadcopter', 'FPV quadcopter'], shape: 'tri', r: 6, hp: 30, evade: 0.35, speed: 190, kamikaze: true, dmg: 130, splash: 22,
    cost: 25, crew: 0, operated: true, endurance: 70, recharge: 25, electric: true, link: 650, time: 0.4, factory: 'droneWorks', vision: 150, air: true, jammable: true, netted: true, targets: ['inf', 'veh', 'struct'], acquire: 260,
    blurb: 'Seven to ten inch racing-style quads built by the hundred thousand a month by shops like Vyriy and Wild Hornets. One to two kilo warhead, radio link, ten or so kilometers of reach. Jammers drop it and nets catch it.' },
  fiberFpv: { label: ['Fiber-optic FPV', 'Knyaz Vandal fiber FPV'], shape: 'tritail', r: 6, hp: 30, evade: 0.35, speed: 140, kamikaze: true, dmg: 130, splash: 22,
    cost: 45, crew: 0, operated: true, tether: true, endurance: 60, recharge: 25, electric: true, link: 500, time: 0.5, factory: 'droneWorks', vision: 150, air: true, jammable: false, netted: true, targets: ['inf', 'veh', 'struct'], acquire: 260,
    blurb: 'Russia showed the idea in 2024 with the Knyaz Vandal Novgorodsky: a spool of fiber instead of a radio link. Ukraine followed within months. Nothing to jam; the spool limits speed. Nets still catch it.' },
  mavic: { label: ['Mavic recon quad', 'Mavic recon quad'], shape: 'diamond', r: 6, hp: 40, evade: 0.3, speed: 135, dmg: 0, cost: 40, crew: 0, operated: true, endurance: 110, recharge: 30, electric: true, link: 650, time: 0.5, recon: true,
    factory: 'droneWorks', vision: 360, air: true, jammable: true,
    blurb: 'DJI Mavic 3 with a thermal camera: the standard tactical eye on both sides. Cheap, everywhere, easily jammed. Artillery can only fire at what your side can see.' },
  fwRecon: { label: ['Shark recon plane', 'Orlan-10 recon plane'], shape: 'plane', r: 8, hp: 80, evade: 0.25, speed: 160, dmg: 0, cost: 150, fuelDrone: true, crew: 0, operated: true, endurance: 600, recharge: 60, link: 1400, large: true, time: 2.5, recon: true,
    factory: 'launchSite', vision: 520, air: true, jammable: true, highAlt: true,
    blurb: 'Fixed-wing spotter. Ukrspecsystems Shark on one side, ZALA Orlan-10 on the other. Flies too high for machine guns; air defense and interceptors can reach it. Its vision is what makes the artillery accurate.' },
  interceptor: { label: ['Sting interceptor', 'Yolka interceptor'], shape: 'star', r: 7, hp: 35, evade: 0.4, speed: 215, range: 70, dmg: 22, rof: 0.5,
    cost: 35, crew: 0, operated: true, endurance: 80, recharge: 25, electric: true, link: 650, time: 0.4, factory: 'droneWorks', vision: 260, air: true, jammable: true, targets: ['air'], acquire: 330,
    blurb: 'Purpose-built high-speed quad that rams or shoots drones. Wild Hornets\' Sting was knocking down Shaheds through 2025; Russia answered with the Yolka. Patrols on its own. Easy prey for air defense.' },
  bomber: { label: ['Vampire heavy bomber (Baba Yaga)', 'Heavy bomber hexacopter'], shape: 'hex', r: 9, hp: 140, evade: 0.15, speed: 130, range: 70, dmg: 50, splash: 34, rof: 2.2,

function typeCount(team, type) {
  let n = 0;

function moraleMul(u) { return u.def.morale ? 0.5 + 0.5 * (u.morale === undefined ? 100 : u.morale) / 100 : 1; }
function updateMorale(dt) {
  const towns = [depots.filter(d => d.owner === UA).length, depots.filter(d => d.owner === RU).length];
  const hqs = [structs.find(st => st.team === UA && st.type === 'hq' && !st.dead), structs.find(st => st.team === RU && st.type === 'hq' && !st.dead)];
  for (const u of units) {
    if (u.dead || !u.def.morale) continue;
    if (u.morale === undefined) u.morale = 90;
    const losing = towns[u.team] < towns[1 - u.team];
    let dm = losing ? -u.def.moraleLoss : 0.3;
    dm -= (1 - supply[u.team].food) * 0.8;
    if (u.def.upkeep) { const pay = u.def.upkeep * dt; if (funds[u.team] >= pay) funds[u.team] -= pay; else dm -= 1.5; }
    const hq = hqs[u.team];
    if ((hq && dist(u, hq) < 260) || structs.some(st => !st.dead && st.def.heal && (st.civ ? st.nation === u.team : st.team === u.team) && dist(u, st) < st.def.heal)) dm += 0.8;
    u.morale = clamp(u.morale + dm * dt, 0, 100);
    if (u.morale <= 0) {
      if (u.team === PL) msg(UNITS[u.type].label[PL] + (u.type === 'merc' ? ' walked off the job' : ' broke and is gone'));
      killUnit(u, true); continue;
    }
    if (u.morale < 30 && !u.shaken) {
      u.shaken = true; u.target = null;
      if (hq) { u.order = { kind: 'move', x: hq.x + rand(-60, 60), y: hq.y + (u.team === UA ? -160 : 160) }; planRoute(u, u.order.x, u.order.y); }
      if (u.team === PL) msg(UNITS[u.type].label[PL] + ' shaken: falling back and not taking orders');

function needsOperator(def, team) { if (def.tether) return true; return !!def.operated && team === UA && autoTier(UA) < 3; }
function operatorsOf(team) { return units.filter(u => u.team === team && !u.dead && u.def.operator); }

function droneCount(op) { return op.drones ? op.drones.filter(d => !d.dead).length : 0; }

}

function landingSpot(u) {
  if (u.operator && !u.operator.dead) return u.operator;
  let best = null, bd = Infinity;
  for (const st of structs) {
    if (st.dead || st.team !== u.team) continue;
    const ok = st.type === 'hq' || st.type === 'droneWorks' || st.type === 'launchSite';
    if (!ok) continue;
    const dd = dist(u, st); if (dd < bd) { bd = dd; best = st; }

}

  for (let i = 0; i < 2; i++) units.push(makeUnit('fireGroup', RU, bg.x - 40 + i * 40, bg.y + 300));
  structs.push(makeStruct('ewStation', RU, bg.x, bg.y + 130, true));
  for (const s of structs) if (s.team === EN) s.rally = { x: ai.staging.x + rand(-80, 80), y: ai.staging.y + rand(-50, 50) };
  tradeT = [30, 45]; tradeTotal = [0, 0]; captured = [0, 0];
  for (const [type, nation, place, dx, dy] of CIV_SITES) { const c = placePos(place); structs.push(makeCiv(type, nation, c.x + dx, c.y + dy)); }
  for (let i = 0; i < 3; i++) { spawnCivCar(0); spawnCivCar(1); }
  for (let i = 0; i < 5; i++) units.push(makeUnit('infantry', RU, bg.x - 80 + i * 40, bg.y + 224 + rand(-30, 30)));
  units.push(makeUnit('ifv', RU, bg.x, bg.y + 264));
  units.push(makeUnit('aa', RU, bg.x, bg.y + 184));

  computeVision(); updateSupply();
  resize();
  const home = PL === UA ? kh : bg;
  cam.z = 1; cam.x = home.x - vw / 2; cam.y = home.y + (PL === UA ? -60 : 60) - vh / 2; clampCam();
  running = true;
  if (tutorial.active) endTutorial();
  document.getElementById('paused').classList.remove('show');
  document.getElementById('pauseBtn').textContent = 'Pause';
  refreshPanels();
  document.getElementById('overlay').style.display = 'none';
}

// ---------------------------------------------------------------- simulation
function tick(dt) {
  gameTime += dt;
  funds[UA] += income(UA) * dt;
  funds[RU] += income(RU) * dt;
  for (const T of [UA, RU]) {
    const towns = depots.filter(d => d.owner === T).length;
    people[T].total = Math.min(200, people[T].total + (1 / 15 + towns / 60 + wheatHeld(T) * 1.5 / 60) * (upgrades[T].training ? 2 : 1) * (T === EN ? difficulty : 1) * supply[T].food * dt);
  }
  computeVision();
  updateSupply();
  updateDepots(dt);
  updateJamming(dt);
  updateNets(dt);
  updateCivilians(dt);
  updateSwarms(dt);
  updateHealing(dt);
  updateTrade(dt);
  updateMorale(dt);
  updateTutorial(dt);
  for (const s of structs) updateStruct(s, dt);
  for (const u of units) updateUnit(u, dt);
  separate();
  for (const p of projectiles) updateProjectile(p, dt);
  for (const e of effects) e.t += dt;
  cleanup();
  updateBot(ai, dt);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.classList.remove('show'); }
  panelTimer -= dt; if (panelTimer <= 0) { panelTimer = 0.4; refreshSelPanel(); refreshQueue(); }
}

function computeVision() {
  vision = [[], []];
  for (const u of units) if (!u.dead && u.team >= 0) vision[u.team].push({ x: u.x, y: u.y, r: u.def.vision * visMul(u.team) * (u.def.air && upgrades[u.team].nightOps ? 1.3 : 1) });
  for (const s of structs) if (!s.dead && s.build >= 1 && s.team >= 0) vision[s.team].push({ x: s.x, y: s.y, r: s.def.vision * visMul(s.team) });
  for (const u of units) {
    if (u.dead) continue;
    u.cover = u.def.air ? 'open' : (u.def.troop && trenchAt(u.x, u.y)) ? 'trench' : coverOf(u.x, u.y);
    if (!u.def.air) u.onRoad = onRoadAt(u.x, u.y);
    const hid = u.def.troop && u.cover !== 'open' ? COVER[u.cover].spot : 0;
    u.seenBy[UA] = u.team === UA || (hid ? inVisionClose(UA, u.x, u.y, hid) : inVision(UA, u.x, u.y));
    u.seenBy[RU] = u.team === RU || (hid ? inVisionClose(RU, u.x, u.y, hid) : inVision(RU, u.x, u.y));
  }
}

function updateDepots(dt) {
  for (const d of depots.concat(resources)) {
    if (d.burnT > 0) d.burnT -= dt;
    let a = 0, b = 0;
    for (const u of units) {
      if (u.dead || !u.def.canCapture) continue;
      if (dist(u, d) <= d.r) { if (u.team === UA) a++; else b++; }
    }
    let team = -1;
    if (a > 0 && b === 0) team = UA; else if (b > 0 && a === 0) team = RU;
    if (team >= 0 && d.owner !== team) {
      if (d.capTeam !== team) { d.capTeam = team; d.cap = 0; }
      d.cap += dt;
      if (d.cap >= 5) {
        const was = d.owner; d.owner = team; d.cap = 0; d.capTeam = -1; d.supplyT = 6;
        if (team === PL) msg(d.name + ' captured'); else if (was === PL) msg(d.name + ' lost' + (d.kind === 'gas' ? ': gas income falls' : d.kind === 'wheat' ? ': fewer recruits' : ''));
      }
    } else { d.cap = Math.max(0, d.cap - dt); if (d.cap === 0) d.capTeam = -1; }
    if (d.owner >= 0 && (!d.isRes || d.burnT <= 0)) {
      d.supplyT -= dt;
      if (d.supplyT <= 0) { d.supplyT = TRUCK_PERIOD; spawnTruck(d.owner, d); }
    }
  }
  // pipeline repair crews rebuild a destroyed pumping station once the area is quiet
  for (const ps of pumpSites) {
    if (ps.struct && !ps.struct.dead) continue;
    ps.rebuildT -= dt;
    if (ps.rebuildT > 0) continue;
    const enemyNear = units.some(u => !u.dead && u.team === 1 - ps.team && !u.def.air && !u.def.auto && dist(u, ps) < 250);
    if (enemyNear) continue;
    ps.struct = makeStruct('pump', ps.team, ps.x, ps.y, false); structs.push(ps.struct);
    if (ps.team === PL) msg('Repair crews are rebuilding the pumping station');
  }
}

function spawnTruck(team, d) {
  const hq = structs.find(s => s.team === team && s.type === 'hq' && !s.dead);
  if (!hq || freePeople(team) < 1) return;
  if (d.isRes) {
    // grain and oil come from the site to headquarters
    const u = makeUnit('truck', team, d.x + rand(-20, 20), d.y + rand(-20, 20));
    u.cargo = d.kind === 'wheat' ? 'grain' : 'oil'; u.src = d; u.dest = hq;
    u.order = { kind: 'move', x: hq.x + rand(-30, 30), y: hq.y + (team === UA ? -(hq.r + 24) : hq.r + 24) };
    planRoute(u, u.order.x, u.order.y);
    units.push(u);
    return;
  }
  const u = makeUnit('truck', team, hq.x + rand(-20, 20), hq.y + (team === UA ? -(hq.r + 22) : hq.r + 22));
  u.cargo = 'supply'; u.dest = d; u.order = { kind: 'move', x: d.x + rand(-20, 20), y: d.y + rand(-20, 20) };
  planRoute(u, u.order.x, u.order.y);
  units.push(u);
}

function tradeEdge(team) { return team === UA ? { x: 12, y: geo(50.16, 35.53).y } : { x: W - 12, y: geo(50.48, 37.86).y }; }
function truckValue(u) { return u.value != null ? u.value : u.cargo === 'oil' ? 120 : u.cargo === 'grain' ? 60 : u.cargo === 'aid' ? 100 : TRUCK_LOAD; }
function spawnTradeConvoy(team) {
  const hq = structs.find(s => s.team === team && s.type === 'hq' && !s.dead);
  if (!hq || freePeople(team) < 1) return;
  const u = makeUnit('truck', team, hq.x + rand(-20, 20), hq.y + (team === UA ? -(hq.r + 22) : hq.r + 22));
  u.cargo = 'export'; u.value = 80 + 40 * wheatHeld(team) + 40 * resources.filter(r => r.kind === 'gas' && r.owner === team).length;
  u.dest = tradeEdge(team); u.order = { kind: 'move', x: u.dest.x, y: u.dest.y }; planRoute(u, u.dest.x, u.dest.y);
  units.push(u);
  if (team === PL) msg('Trade convoy leaving for ' + (team === UA ? 'the NATO border' : 'the Russian interior') + ' with ' + u.value + ' worth of grain and gas');
}
function updateTrade(dt) {
  for (const T of [UA, RU]) { tradeT[T] -= dt; if (tradeT[T] <= 0) { tradeT[T] = 75; spawnTradeConvoy(T); } }
  // truck capture: an enemy squad standing over an unescorted truck takes it and its cargo
  for (const u of units) {
    if (u.dead || u.type !== 'truck') continue;
    const E = 1 - u.team;
    const captor = units.find(o => !o.dead && o.team === E && o.def.troop && dist(o, u) < 45);
    if (!captor) continue;
    if (units.some(o => !o.dead && o.team === u.team && !o.def.air && !o.def.auto && dist(o, u) < 120)) continue;
    const val = truckValue(u), loser = u.team;
    u.team = E; u.seenBy = [E === UA, E === RU]; u.cargo = 'captured'; u.value = val; u.src = null; u.detour = null; u.path = null;
    const hq = structs.find(s => s.team === E && s.type === 'hq' && !s.dead);
    if (!hq) { killUnit(u, true); continue; }
    u.dest = hq; u.order = { kind: 'move', x: hq.x + rand(-30, 30), y: hq.y + (E === UA ? -(hq.r + 24) : hq.r + 24) }; planRoute(u, u.order.x, u.order.y);
    captured[E]++;
    effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.8, green: E === PL });
    if (E === PL) msg('Captured an enemy truck carrying ' + val + ' worth of supplies: it is driving to your headquarters'); else if (loser === PL) msg('Your truck was captured');
  }
}
function updateTruck(u, dt) {
  const px = u.x, py = u.y;
  if (u.cargo === 'export' || u.cargo === 'aid' || u.cargo === 'captured') {
    if (!u.dest || u.dest.dead) { killUnit(u, true); return; }
    stepMove(u, u.order.x, u.order.y, dt);
    if (Math.hypot(u.x - px, u.y - py) < 0.15) { u.stuck = (u.stuck || 0) + dt; if (u.stuck > 12) { killUnit(u, true); return; } } else u.stuck = 0;
    const arriveR = u.cargo === 'export' ? 30 : u.dest.r + 40;
    if (dist(u, u.dest) < arriveR) {
      if (u.cargo === 'export') {
        funds[u.team] += u.value * teamMul(u.team) * logiMul(u.team); tradeTotal[u.team] += Math.round(u.value * logiMul(u.team));
        if (u.team === PL) msg('Trade convoy crossed the border: +' + u.value + ' funds. Supplies are on the way back.');
        const hq = structs.find(s => s.team === u.team && s.type === 'hq' && !s.dead);
        if (hq) { const back = makeUnit('truck', u.team, u.x, u.y); back.cargo = 'aid'; back.value = 100; back.dest = hq; back.order = { kind: 'move', x: hq.x + rand(-30, 30), y: hq.y + (u.team === UA ? -(hq.r + 24) : hq.r + 24) }; planRoute(back, back.order.x, back.order.y); units.push(back); }
      } else {
        funds[u.team] += u.value * teamMul(u.team) * logiMul(u.team); stats.deliveries[u.team]++;
        if (u.team === PL) effects.push({ kind: 'text', x: u.x, y: u.y - 14, t: 0, dur: 1.2, text: (u.cargo === 'aid' ? 'aid: +' : 'captured: +') + u.value });
      }
      effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.6, green: true });
      killUnit(u, true);
    }
    return;
  }
  const stuckCheck = () => { if (Math.hypot(u.x - px, u.y - py) < 0.15) { u.stuck = (u.stuck || 0) + dt; if (u.stuck > 10) { killUnit(u, true); return true; } } else u.stuck = 0; return false; };
  if (u.cargo === 'grain' || u.cargo === 'oil') {
    if (!u.dest || u.dest.dead) { killUnit(u, true); return; }
    stepMove(u, u.order.x, u.order.y, dt);
    if (stuckCheck()) return;
    if (dist(u, u.dest) < u.dest.r + 40) {
      const mul = teamMul(u.team);
      if (u.cargo === 'grain') { people[u.team].total = Math.min(200, people[u.team].total + 3); if (u.team === UA) support = Math.min(100, support + 2); funds[u.team] += 30 * mul * logiMul(u.team); }
      else funds[u.team] += 120 * mul * logiMul(u.team);
      stats.deliveries[u.team]++;
      effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.6, green: true });
      if (u.team === PL) effects.push({ kind: 'text', x: u.x, y: u.y - 14, t: 0, dur: 1.2, text: u.cargo === 'grain' ? 'grain: +3 recruits' : 'oil: +120' });
      killUnit(u, true);
    }
    return;
  }
  if (!u.dest || u.dest.owner !== u.team) { killUnit(u, true); return; }
  stepMove(u, u.order.x, u.order.y, dt);
  if (stuckCheck()) return;
  if (dist(u, u.dest) < 40) {
    funds[u.team] += TRUCK_LOAD * teamMul(u.team) * logiMul(u.team); stats.deliveries[u.team]++;
    effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.6, green: true });
    if (u.team === PL) effects.push({ kind: 'text', x: u.x, y: u.y - 14, t: 0, dur: 1.2, text: '+' + TRUCK_LOAD });
    killUnit(u, true);
  }
}

function updateHealing(dt) {
  for (const st of structs) {
    if (st.dead || !st.def.heal || st.build < 1) continue;
    const team = st.civ ? st.nation : st.team;
    for (const u of units) {
      if (u.dead || u.team !== team || !u.def.troop || u.hp >= u.def.hp) continue;
      if (dist(u, st) > st.def.heal) continue;
      u.hp = Math.min(u.def.hp, u.hp + u.def.hp * st.def.healRate * (upgrades[team].medevac ? 2 : 1) * supply[team].food * dt);
      if (Math.random() < dt * 1.5) effects.push({ kind: 'heal', x: u.x + rand(-6, 6), y: u.y - 8, t: 0, dur: 0.8 });
    }
  }
}
function updateNets(dt) {
  const nets = [];
  for (const s of structs) if (!s.dead && s.build >= 1 && s.def.netR) nets.push(s);
  if (!nets.length) return;
  for (const u of units) {
    if (u.dead || !u.def.netted || u.landed) continue;
    for (const n of nets) {
      if (n.team === u.team || u.netsSeen.includes(n.id)) continue;
      if (dist(u, n) <= n.def.netR) {
        u.netsSeen.push(n.id);
        if (Math.random() < 0.85) { effects.push({ kind: 'caught', x: u.x, y: u.y, t: 0, dur: 0.5 }); killUnit(u, true); break; }
      }
    }
  }
}

function updateJamming(dt) {
  const src = [];
  for (const u of units) if (!u.dead && u.def.jam) src.push({ x: u.x, y: u.y, r: u.def.jam, team: u.team });
  for (const s of structs) if (!s.dead && s.build >= 1 && s.def.jam) src.push({ x: s.x, y: s.y, r: s.def.jam, team: s.team });
  if (!src.length) return;
  for (const u of units) {
    if (u.dead || !u.def.air || !u.def.jammable || u.landed) continue;
    for (const j of src) {
      if (j.team === u.team) continue;
      if (dist(u, j) <= j.r + (upgrades[j.team].ewPlus ? 60 : 0)) { u.hp -= 30 * (upgrades[u.team].freqHop ? 0.5 : 1) * dt; u.jamT = 0.2; if (u.hp <= 0) { killUnit(u); break; } }
    }
  }
}

function updateStruct(s, dt) {
  if (s.dead || s.civ) return;
  if (s.build < 1) {
    s.build += dt / s.def.time;
    s.hp = Math.min(s.def.hp, s.hp + s.def.hp * 0.9 * dt / s.def.time);
    if (s.build >= 1) { s.build = 1; if (s.team === PL) { msg(s.def.label + ' ready'); refreshPanels(); } }
    return;
  }
  if (s.def.heatPer) {
    s.heat = Math.max(0, s.heat - s.def.cool * dt);
    if (s.overheated && s.heat < 35) { s.overheated = false; if (s.team === PL) msg(s.def.label + ' cooled down: backlog moving'); }
  }
  if (s.queue.length) {
    const d = UNITS[s.queue[0]];
    if (!(s.overheated && d.air)) s.progress += dt;
    if (s.progress >= d.time) {
      s.progress = 0; spawnFromFactory(s, s.queue.shift());
      if (s.def.heatPer && d.air) { s.heat += s.def.heatPer; if (s.heat >= 100) { s.heat = 100; s.overheated = true; if (s.team === PL) msg(s.def.label + ' overheated: production backlog until it cools'); } }
      if (s.team === PL) refreshQueue();
    }
  }
}

function spawnFromFactory(s, type) {
  const dir = s.team === UA ? -1 : 1;
  const u = makeUnit(type, s.team, s.x + rand(-14, 14), s.y + dir * (s.r + 16));
  u.order = { kind: 'move', x: s.rally.x + rand(-24, 24), y: s.rally.y + rand(-24, 24) };
  planRoute(u, u.order.x, u.order.y);
  if (needsOperator(u.def, s.team)) { let best = null, bd = Infinity; for (const op of operatorsOf(s.team)) { if (droneCount(op) >= opCap(s.team)) continue; const dd = dist(op, s); if (dd < bd) { bd = dd; best = op; } } if (best) linkDrone(u, best); else { u.grounded = true; u.order = { kind: 'idle' }; u.x = s.x + rand(-40, 40); u.y = s.y + (s.team === UA ? -1 : 1) * (s.r + 30 + rand(0, 30)); } }
  units.push(u); stats.built[s.team]++; if (u.def.air) stats.drones[s.team]++;
}

function acquireFor(src, maxR, minR) {
  const T = src.def.targets;
  if (!T) return null;
  let best = null, bd = Infinity;
  for (const e of units) {
    if (e.dead || e.team === src.team || e.team < 0 || !e.seenBy[src.team] || !canEngage(src.def, e) || e.landed) continue;
    const dd = dist(src, e);
    if (dd <= maxR && dd >= minR && dd < bd) { bd = dd; best = e; }
  }
  if (T.includes('struct')) for (const s of structs) {
    if (s.dead || s.team === src.team || s.team < 0) continue;
    const dd = dist(src, s) - s.r * 0.5;
    if (dd <= maxR && dd >= minR && dd < bd) { bd = dd; best = s; }
  }
  return best;
}

function acquirePreferred(u, maxR) {
  let best = null, bd = Infinity;
  for (const e of units) {
    if (e.dead || e.team === u.team || e.team < 0 || !u.def.prefer.includes(e.type) || !e.seenBy[u.team] || !canEngage(u.def, e)) continue;
    const dd = dist(u, e); if (dd <= maxR && dd < bd) { bd = dd; best = e; }
  }
  return best;
}
function targetClass(e) { return e.isStruct ? 'struct' : e.def.air ? 'air' : e.def.troop ? 'inf' : 'veh'; }
function canEngage(srcDef, e) {
  if (!srcDef.targets) return false;
  const cls = targetClass(e);
  if (!srcDef.targets.includes(cls)) return false;
  if (cls === 'air' && e.def.highAlt && srcDef.lowAlt) return false;
  return true;
}
function canHitTarget(u, t) { return (u.def.kamikaze || u.def.dmg > 0) && canEngage(u.def, t); }

function moveToward(u, tx, ty, dt) {
  if (!u.def.air && u.detour) {
    if (Math.hypot(u.detour.x - u.x, u.detour.y - u.y) < 26) u.detour = null;
    else { tx = u.detour.x; ty = u.detour.y; }
  }
  const dx = tx - u.x, dy = ty - u.y, dd = Math.hypot(dx, dy);
  if (dd < 0.5) return;
  const step = Math.min(dd, u.def.speed * (u.onRoad ? (u.def.roadMul || 1.4) : 1) * (u.def.morale ? 0.7 + 0.3 * moraleMul(u) : 1) * fuelMul(u) * dt);
  const nx = u.x + dx / dd * step, ny = u.y + dy / dd * step;
  if (!u.def.air) {
    const blk = waterBlock(u.x, u.y, nx, ny);
    if (blk) {
      // slide along the bank instead of stopping dead, so travel parallel to a river keeps going
      if (blk !== 'poly') {
        const tx_ = blk[1].x - blk[0].x, ty_ = blk[1].y - blk[0].y, L = Math.hypot(tx_, ty_) || 1, ux = tx_ / L, uy = ty_ / L;
        const proj = (dx / dd * step) * ux + (dy / dd * step) * uy;
        const sx = u.x + ux * proj, sy = u.y + uy * proj;
        if (Math.abs(proj) > 0.05 && !waterBlock(u.x, u.y, sx, sy)) { u.x = sx; u.y = sy; u.angle = Math.atan2(uy * Math.sign(proj), ux * Math.sign(proj)); return; }
      }
      if (!u.detour) { const b = nearestBridge(u, 900); if (b) u.detour = b; }
      return;
    }
  }
  u.x = nx; u.y = ny; u.angle = Math.atan2(dy, dx);
}
function moveAway(u, t, dt) {
  const dx = u.x - t.x, dy = u.y - t.y, dd = Math.hypot(dx, dy) || 1;
  const step = u.def.speed * dt;
  u.x += dx / dd * step; u.y += dy / dd * step;
}

function updateUnit(u, dt) {
  if (u.dead) return;
  const d = u.def;
  u.cool -= dt; if (u.jamT > 0) u.jamT -= dt;
  if (u.target && u.target.dead) u.target = null;
  if (u.order.kind === 'attack' && (!u.order.target || u.order.target.dead)) u.order = { kind: 'idle' };
  const range = rangeOf(u), minR = d.minRange || 0;

  if (d.civ) { updateCivCar(u, dt); return; }
  if (d.auto) { updateTruck(u, dt); return; }
  if (u.grounded) {
    if (!needsOperator(d, u.team)) { u.grounded = false; }
    else if (relink(u)) { u.grounded = false; if (u.team === PL) msg(d.label[PL] + ' has an operator and is airborne'); }
    else return;
  }
  if (d.endurance) {
    if (u.batt === undefined) u.batt = d.endurance;
    if (u.landed) { u.rechargeT -= dt * (u.team >= 0 && supply[u.team].power < 1 ? 1 / 3 : 1); if (u.rechargeT <= 0) { u.landed = false; u.batt = d.endurance; u.grace = 0; } return; }
    const diving = d.kamikaze && u.target && !u.target.dead;
    if (!diving) u.batt -= dt;
    if (!diving && u.batt < d.endurance * 0.25) {
      const spot = landingSpot(u);
      if (!spot) { if (u.batt <= 0) { crashDrone(u, 'battery flat, nowhere to land'); return; } }
      else {
        const dd = dist(u, spot);
        if (dd < 50) { u.landed = true; u.rechargeT = d.recharge || 30; u.order = { kind: 'idle' }; u.target = null; effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.6 }); return; }
        if (u.batt <= 0) { u.grace = (u.grace || 0) + dt; if (u.grace > 30) { crashDrone(u, 'battery flat before it got home'); return; } }
        if (!u.order || u.order.kind !== 'move' || Math.hypot(u.order.x - spot.x, u.order.y - spot.y) > 40) { u.order = { kind: 'move', x: spot.x, y: spot.y }; u.target = null; }
        moveToward(u, spot.x, spot.y, dt);
        return;
      }
    }
  }
  if (needsOperator(d, u.team)) {
    if (!u.operator || u.operator.dead) {
      u.operator = null;
      if (!relink(u)) {
        u.lostT = (u.lostT || 0) + dt;
        if (u.lostT > (upgrades[u.team].auto1 ? 10 : 4) && !(d.kamikaze && u.target && !u.target.dead)) { u.grounded = true; u.order = { kind: 'idle' }; u.target = null; u.lostT = 0; effects.push({ kind: 'mark', x: u.x, y: u.y, t: 0, dur: 0.8 }); if (u.team === PL) msg(d.label[PL] + ' landed: its squad is gone, it waits for another'); return; }
      } else u.lostT = 0;
    } else {
      const R = linkRange(u), dd = dist(u, u.operator);
      if (dd > R && !(d.kamikaze && u.target && !u.target.dead)) {
        const k = (R * 0.85) / dd;
        u.order = { kind: 'move', x: u.operator.x + (u.x - u.operator.x) * k, y: u.operator.y + (u.y - u.operator.y) * k }; u.target = null;
      }
    }
  }
  if (d.kamikaze) { updateKamikaze(u, dt); return; }

  if (u.salvoLeft > 0) {
    if (u.salvoAt) { u.salvoT -= dt; if (u.salvoT <= 0) { launchShellAt(u, u.salvoAt.x, u.salvoAt.y, u.salvoAt.spread); u.salvoLeft--; u.salvoT = 0.18; } }
    else if (!u.target || u.target.dead) u.salvoLeft = 0;
    else { u.salvoT -= dt; if (u.salvoT <= 0) { launchShell(u, u.target); u.salvoLeft--; u.salvoT = 0.18; } }
  }
  // digging in: a troop unit stays put for 20 seconds and leaves a trench behind
  if (u.order.kind === 'dig') {
    u.digT = (u.digT === undefined ? 20 : u.digT) - dt;
    u.target = null;
    if (u.digT <= 0) {
      u.digT = undefined;
      if (!trenchAt(u.x, u.y)) { const tr = makeStruct('trench', u.team, u.x, u.y, true); tr.hp = tr.def.hp; structs.push(tr); if (u.team === PL) msg('Trench dug'); }
      u.order = { kind: 'idle' };
    }
    return;
  }
  u.digT = undefined;
  // area fire: artillery shells a map point whether or not anyone can see it; unspotted fire scatters more
  if (u.order.kind === 'bombard' && d.indirect) {
    const dd = dist(u, u.order);
    if (dd > range) moveToward(u, u.order.x, u.order.y, dt);
    else if (minR && dd < minR) moveAway(u, u.order, dt);
    else if (u.cool <= 0) {
      const vis = acquireFor(u, range, minR);
      if (vis && vis.isUnit) fireAt(u, vis);
      else {
        u.cool = d.rof; u.angle = Math.atan2(u.order.y - u.y, u.order.x - u.x);
        const spread = inVision(u.team, u.order.x, u.order.y) ? 1 : 2.4;
        launchShellAt(u, u.order.x, u.order.y, spread);
        if (d.salvo) { u.salvoLeft = d.salvo - 1; u.salvoT = 0.18; u.salvoAt = { x: u.order.x, y: u.order.y, spread }; }
      }
    }
    u.target = null;
    return;
  }
  u.salvoAt = null;

  let tgt = null;
  if (u.order.kind === 'attack') tgt = u.order.target;
  else if (d.dmg > 0) {
    const hunt = d.acquire ? d.acquire + (upgrades[u.team].repeaters ? 120 : 0) : range;
    if (u.target && dist(u, u.target) <= Math.max(range, hunt) && canSee(u, u.target)) tgt = u.target;
    else tgt = acquireFor(u, u.order.kind === 'idle' ? hunt : range, minR);
  }
  u.target = tgt;

  if (u.order.kind === 'move') {
    const dd = dist(u, u.order);
    const last = stepMove(u, u.order.x, u.order.y, dt);
    if ((last && dd < 6) || last === 'stalled') { u.order = { kind: 'idle' }; u.path = null; }
  } else if (u.order.kind === 'attack' && tgt) {
    const dd = dist(u, tgt) - (tgt.isStruct ? tgt.r * 0.5 : 0);
    if (dd > range * 0.9) moveToward(u, tgt.x, tgt.y, dt);
    else if (minR && dd < minR) moveAway(u, tgt, dt);
  } else if (u.order.kind === 'idle' && tgt) {
    // idle units hold position and fire at what is in range; only hunters (acquire) chase
    const dd = dist(u, tgt) - (tgt.isStruct ? tgt.r * 0.5 : 0);
    if (d.acquire && dd > range * 0.9) moveToward(u, tgt.x, tgt.y, dt);
    else if (minR && dd < minR) moveAway(u, tgt, dt);
  }

  if (tgt && d.dmg > 0 && u.cool <= 0) {
    const dd = dist(u, tgt) - (tgt.isStruct ? tgt.r * 0.5 : 0);
    if (dd <= range && dd >= minR && canSee(u, tgt) && canHitTarget(u, tgt)) fireAt(u, tgt);
  }
}

function updateKamikaze(u, dt) {
  const d = u.def;
  if (u.order.kind === 'attack' && u.order.target && !u.order.target.dead) u.target = u.order.target;
  if (!u.target) {
    if (u.order.kind === 'move') {
      const dd = dist(u, u.order);
      moveToward(u, u.order.x, u.order.y, dt);
      if (dd < 6) u.order = { kind: 'idle' };
    }
    if (d.acquire > 0) {
      const reach = d.acquire + (upgrades[u.team].repeaters ? 120 : 0);
      const t = (d.prefer && acquirePreferred(u, reach)) || acquireFor(u, reach, 0);
      if (t && inLink(u, t)) { u.target = t; u.order = { kind: 'attack', target: t }; }
    }
    return;
  }
  moveToward(u, u.target.x, u.target.y, dt);
  if (dist(u, u.target) <= rOf(u.target) + 4) {
    if (d.dmg > 0) { explosionFx(u.x, u.y, d.splash + 14, true); damageArea(u.x, u.y, d.splash, d.dmg, u.team, u.target, 1, 1, true); }
    else effects.push({ kind: 'caught', x: u.x, y: u.y, t: 0, dur: 0.4 });
    killUnit(u, true);
  }
}

function fireAt(u, t) {
  const d = u.def;
  u.cool = d.rof;
  u.angle = Math.atan2(t.y - u.y, t.x - u.x);
  if (d.indirect) {
    launchShell(u, t);
    if (d.salvo) { u.salvoLeft = d.salvo - 1; u.salvoT = 0.18; }
  } else {
    directHit(u, t, d.dmg * (d.troop ? COVER[u.cover || 'open'].give * foodMul(u.team) : 1) * moraleMul(u) * (!d.air && upgrades[u.team].ammo ? 1.15 : 1), d.splash || 0);
  }
}

function isVehicle(t) { return t.isUnit && !t.def.air && t.type !== 'infantry'; }
function directHit(src, t, dmg, splash) {
  effects.push({ kind: 'tracer', x: src.x, y: src.y, tx: t.x, ty: t.y, t: 0, dur: 0.12, team: src.team });
  if (t.isUnit && t.def.air) {
    const ev = clamp((t.def.evade || 0) + (t.team >= 0 && upgrades[t.team].evasion ? 0.15 : 0) - (src.team >= 0 && upgrades[src.team].gunnery ? 0.15 : 0), 0, 0.85);
    if (Math.random() < ev) { effects.push({ kind: 'hit', x: t.x + rand(-14, 14), y: t.y + rand(-14, 14), t: 0, dur: 0.15 }); return; }
  }
  const vs = src.def.vsStruct || 1, vv = src.def.vsVehicle || 1;
  if (splash > 0) { explosionFx(t.x, t.y, splash * 0.7, false); damageArea(t.x, t.y, splash, dmg, src.team, t, vs, vv, !!src.def.air); }
  else { applyDamage(t, t.isStruct ? dmg * vs : isVehicle(t) ? dmg * vv : dmg, src.team, !!src.def.air); effects.push({ kind: 'hit', x: t.x + rand(-3, 3), y: t.y + rand(-3, 3), t: 0, dur: 0.18 }); }
}

function launchShell(u, t) { launchShellAt(u, t.x, t.y, 1); }
function launchShellAt(u, px, py, spreadMul) {
  const d = u.def;
  const spread = (d.salvo ? 34 : 14) * (spreadMul || 1);
  const tx = px + rand(-spread, spread), ty = py + rand(-spread, spread);
  const dd = Math.hypot(tx - u.x, ty - u.y);
  projectiles.push({ x: u.x, y: u.y, sx: u.x, sy: u.y, tx, ty, t: 0, dur: dd / d.shellSpeed, dmg: d.dmg * (upgrades[u.team].ammo ? 1.15 : 1), splash: d.splash, team: u.team,
    arc: Math.min(110, dd * 0.22), rocket: !!d.salvo, dead: false });
  effects.push({ kind: 'flash', x: u.x + Math.cos(u.angle) * 14, y: u.y + Math.sin(u.angle) * 14, t: 0, dur: 0.1 });
}

function updateProjectile(p, dt) {
  if (p.dead) return;
  p.t += dt;
  const k = Math.min(1, p.t / p.dur);
  p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k;
  if (p.t >= p.dur) {
    p.dead = true;
    explosionFx(p.tx, p.ty, p.splash, true);
    damageArea(p.tx, p.ty, p.splash, p.dmg, p.team, null);
  }
}

function damageArea(x, y, r, dmg, team, primary, vsStruct, vsVehicle, drone) {
  const vs = vsStruct || 1, vv = vsVehicle || 1;
  if (dmg >= 30) for (const rs of resources) if (rs.kind === 'wheat' && rs.burnT <= 0 && Math.hypot(rs.x - x, rs.y - y) < rs.r) { rs.burnT = 60; if (rs.owner === UA) msg('Wheat field burning'); }
  for (const e of units) {
    if (e.dead || e.team === team || e.def.air) continue;
    const dd = Math.hypot(e.x - x, e.y - y) - e.def.r;
    if (dd <= r) applyDamage(e, (e === primary ? dmg : dmg * (1 - 0.6 * clamp(dd / r, 0, 1))) * (isVehicle(e) ? vv : 1), team, drone);
  }
  for (const s of structs) {
    if (s.dead || s.team === team) continue;
    const dd = Math.hypot(s.x - x, s.y - y) - s.r;
    if (dd <= r) applyDamage(s, (s === primary ? dmg : dmg * (1 - 0.6 * clamp(dd / r, 0, 1))) * vs, team);
  }
}

function applyDamage(t, amt, team, drone) {
  if (t.dead) return;
  if (drone && t.isUnit && isVehicle(t) && t.team >= 0 && upgrades[t.team].cages) amt *= 0.65;
  if (t.isUnit && t.def.troop) { const cv = COVER[t.cover || 'open']; amt *= cv.take; if (drone) amt *= cv.drone; }
  if (t.isUnit && t.def.morale) t.morale = clamp((t.morale === undefined ? 90 : t.morale) - amt * 0.25, 0, 100);
  t.hp -= amt; t.lastHitBy = team;
  if (t.hp <= 0) { if (t.isUnit) killUnit(t, false, team); else destroyStruct(t, team); }
}

function killUnit(u, silent, byTeam) {
  if (u.dead) return;
  u.dead = true;
  if (u.team < 0) {
    if (byTeam === UA) { civ.carsKilled[0]++; supportHit(4, 'A civilian vehicle was hit by your strike.'); }
    else if (byTeam === RU) civ.carsKilled[1]++;
    explosionFx(u.x, u.y, 12, false);
    return;
  }
  stats.lost[u.team]++;
  if (u.def.troop) for (const o of units) if (!o.dead && o !== u && o.team === u.team && o.def.morale && dist(o, u) < 300) o.morale = clamp((o.morale === undefined ? 90 : o.morale) - 12, 0, 100);
  if (u.operator && u.operator.drones) u.operator.drones = u.operator.drones.filter(x => x !== u);
  if (u.drones) { for (const dr of u.drones) dr.operator = null; u.drones = []; }
  if (!u.def.air && u.def.crew) { const lost = Math.floor(u.def.crew * (upgrades[u.team].medevac ? 0.25 : 0.5) + Math.random()); people[u.team].total = Math.max(0, people[u.team].total - lost); stats.peopleLost[u.team] += lost; }
  if (!silent) explosionFx(u.x, u.y, u.def.air ? 10 : u.def.r + 8, !u.def.air);
  const i = selection.indexOf(u); if (i >= 0) { selection.splice(i, 1); refreshPanels(); }
}

function destroyStruct(s, byTeam) {
  if (s.dead) return;
  s.dead = true;
  explosionFx(s.x, s.y, s.r + 30, true);
  scorchAll(s.x, s.y, s.r + 18);
  if (s.civ) {
    civ.lost[s.nation]++;
    if (byTeam === UA) {
      if (s.nation === 1) { civ.harmedByUA++; funds[UA] = Math.max(0, funds[UA] - 200); supportHit(12, 'Your strike destroyed a Russian ' + s.def.label.toLowerCase() + '.'); }
      else supportHit(6, 'Your own strike destroyed a Ukrainian ' + s.def.label.toLowerCase() + '.');
    } else if (s.nation === 0) msg('Ukrainian ' + s.def.label.toLowerCase() + ' destroyed by enemy fire');
    return;
  }
  if (s.type === 'pump') { const ps = pumpSites.find(x => x.struct === s); if (ps) ps.rebuildT = 120; if (s.team === PL) msg('Pumping station destroyed: gas flow stopped'); }
  else if (s.team === PL && !s.def.trench) msg(s.def.label + ' destroyed');
  const i = selection.indexOf(s); if (i >= 0) { selection.splice(i, 1); }
  refreshPanels();
  if (s.type === 'hq') endGame(1 - s.team);
}

function explosionFx(x, y, r, mark) {
  effects.push({ kind: 'boom', x, y, r, t: 0, dur: 0.45 + r / 120 });
  if (mark && r >= 20) scorchAll(x, y, r * 0.8);
}

function separate() {
  const g = [];
  for (const u of units) if (!u.dead && !u.def.air) g.push(u);
  for (let i = 0; i < g.length; i++) {
    const a = g[i];
    for (let j = i + 1; j < g.length; j++) {
      const b = g[j];
      const dx = b.x - a.x, dy = b.y - a.y, min = a.def.r + b.def.r + 2;
      const d2 = dx * dx + dy * dy;
      if (d2 < min * min && d2 > 0.01) {
        const dd = Math.sqrt(d2), push = (min - dd) / 2 * 0.6, nx = dx / dd, ny = dy / dd;
        a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      } else if (d2 <= 0.01) { a.x += rand(-1, 1); a.y += rand(-1, 1); }
    }
    for (const s of structs) {
      if (s.dead || s.def.trench) continue;
      const dx = a.x - s.x, dy = a.y - s.y, min = s.r + a.def.r + 3, d2 = dx * dx + dy * dy;
      if (d2 < min * min) { const dd = Math.sqrt(d2) || 1; a.x = s.x + dx / dd * min; a.y = s.y + dy / dd * min; }
    }
  }
  for (const u of units) { u.x = clamp(u.x, 6, W - 6); u.y = clamp(u.y, 6, (u.def.air ? H : H_LAND) - 6); }
}

function cleanup() {
  units = units.filter(u => !u.dead);
  structs = structs.filter(s => !s.dead);
  projectiles = projectiles.filter(p => !p.dead);
  effects = effects.filter(e => e.t < e.dur);
  for (const k in groups) groups[k] = groups[k].filter(u => !u.dead);
}

function endGame(winner) {
  if (gameOver) return;
  gameOver = true;
  showResult(winner);
}

// ---------------------------------------------------------------- bot (used by the enemy; team-parametric)
function weightedPick(table) {
  let sum = 0; for (const [, w] of table) sum += w;
  let r = Math.random() * sum;
  for (const [k, w] of table) { r -= w; if (r <= 0) return k; }
  return table[table.length - 1][0];
}

function makeBot(team, staging) {
  return { team, staging, spendT: 2, attackT: 0, shahedT: 240, warnT: 0, warnName: '', defendT: 0, artyT: 0, pending: null };
}

function updateBot(bot, dt) {
  const T = bot.team, E = 1 - T, t = gameTime;
  bot.spendT -= dt;
  if (bot.spendT <= 0) { bot.spendT = 1; botSpend(bot); }
  bot.attackT += dt;
  // maneuver units: everything except drones that hunt on their own, artillery, recon, and trucks
  const staging = units.filter(u => u.team === T && !u.dead && !u.def.structuresOnly && !u.def.auto && !u.def.indirect && !u.def.recon && u.order.kind === 'idle');
  const value = staging.reduce((a, u) => a + u.def.cost, 0);
  const threshold = Math.min(2600, 700 + t * 2);
  const homeHq = structs.find(s => s.team === T && s.type === 'hq');
  // since buildings do not shoot, keep a home guard of the four ground units nearest the headquarters
  const guard = homeHq ? staging.filter(u => !u.def.air).sort((a, b) => dist(a, homeHq) - dist(b, homeHq)).slice(0, 4) : [];
  const sortie = staging.filter(u => !guard.includes(u));
  const sortieValue = sortie.reduce((a, u) => a + u.def.cost, 0);
  if (!tutPassive() && t > 60 && sortie.length >= 3 && (sortieValue >= threshold || (bot.attackT > 45 && sortieValue >= 300))) { botLaunch(bot, sortie); bot.attackT = 0; }
  // base defense: anything within reach of the headquarters turns on intruders near it
  bot.defendT -= dt;
  if (bot.defendT <= 0) {
    const hq = homeHq;
    if (hq) {
      let intruder = null, bd = 560;
      for (const u of units) if (u.team === E && !u.dead && !u.def.air && !u.def.auto && u.seenBy[T]) { const dd = dist(u, hq); if (dd < bd) { bd = dd; intruder = u; } }
      if (intruder) {
        for (const u of staging) { u.order = { kind: 'move', x: intruder.x + rand(-50, 50), y: intruder.y + rand(-50, 50) }; u.target = null; planRoute(u, u.order.x, u.order.y); }
        bot.defendT = 12;
      }
    }
  }
  // troops that have been standing still at the front for a while dig in
  for (const u of units) {
    if (u.dead || u.team !== T || !u.def.troop || u.order.kind !== 'idle') { if (u.team === T) u.idleT = 0; continue; }
    u.idleT = (u.idleT || 0) + dt;
    if (u.idleT > 15 && !trenchAt(u.x, u.y) && !u.shaken) { u.order = { kind: 'dig', x: u.x, y: u.y }; u.digT = 20; u.idleT = 0; }
  }
  // firebase: artillery moves up to the held town closest to the enemy headquarters, recon drones spot ahead of it
  bot.artyT -= dt;
  if (bot.artyT <= 0) {
    bot.artyT = 5;
    const arty = units.filter(u => u.team === T && !u.dead && u.def.indirect);
    const recon = units.filter(u => u.team === T && !u.dead && u.def.recon);
    if (arty.length || recon.length) {
      const enemyHq = structs.find(s => s.team === E && s.type === 'hq');
      const held = depots.filter(d => d.owner === T);
      const toward = T === RU ? 1 : -1;
      let fb = { x: bot.staging.x, y: bot.staging.y };
      if (held.length && enemyHq) { held.sort((a, b) => dist(a, enemyHq) - dist(b, enemyHq)); fb = { x: held[0].x, y: held[0].y - toward * 90 }; }
      for (const u of arty) if (u.order.kind === 'idle' && dist(u, fb) > 90) { u.order = { kind: 'move', x: fb.x + rand(-50, 50), y: fb.y + rand(-30, 30) }; planRoute(u, u.order.x, u.order.y); }
      // with nothing in sight, guns in position fire on known enemy positions: pumps, buildings, held towns
      for (const u of arty) {
        if (u.order.kind !== 'idle' || u.target) continue;
        const rng = rangeOf(u), minR = u.def.minRange || 0;
        const known = structs.filter(st => st.team === E && !st.dead).map(st => ({ x: st.x, y: st.y, w: st.type === 'pump' ? 3 : st.type === 'hq' ? 2 : 1 }))
          .concat(depots.filter(dp => dp.owner === E).map(dp => ({ x: dp.x, y: dp.y, w: 2 })))
          .filter(pnt => { const dd = dist(u, pnt); return dd <= rng && dd >= minR; });
        if (known.length) { known.sort((a, b) => b.w - a.w || dist(u, a) - dist(u, b)); u.order = { kind: 'bombard', x: known[0].x, y: known[0].y }; }
      }
      recon.forEach((u, k) => { if (u.order.kind === 'idle') { const tx = fb.x + (k - 1) * 150, ty = fb.y + toward * 230; if (dist(u, { x: tx, y: ty }) > 60) u.order = { kind: 'move', x: tx, y: ty }; } });
    }
  }
  // pipeline raids: a few idle kamikaze drones go for the nearest enemy pumping station
  bot.raidT = (bot.raidT || 120) - dt;
  if (bot.raidT <= 0 && t > 150 && !tutPassive()) {
    bot.raidT = 100;
    const targets = pumpSites.filter(ps => ps.team === E && ps.struct && !ps.struct.dead);
    if (targets.length) {
      targets.sort((a, b) => dist(a, bot.staging) - dist(b, bot.staging));
      const tgt = targets[0].struct;
      const raiders = units.filter(u => u.team === T && !u.dead && u.def.kamikaze && !u.def.structuresOnly && u.order.kind === 'idle').slice(0, 4);
      for (const u of raiders) { u.order = { kind: 'attack', target: tgt }; u.target = tgt; }
      if (raiders.length && E === PL) { bot.warnT = 4; bot.warnName = 'a pumping station'; }
    }
  }
  if (T === RU) {
    bot.shahedT -= dt;
    if (bot.shahedT <= 0) { bot.shahedT = tutNoGerans() ? 20 : Math.max(55, 125 - t / 25); if (!tutNoGerans()) spawnShaheds(); }
  }
  if (bot.warnT > 0) { bot.warnT -= dt; if (bot.warnT <= 0 && T === EN) msg('Enemy column moving toward ' + bot.warnName); }
  // research: from the fourth minute the bot buys one available tech every 90 seconds when it can afford it, drones and people first
  bot.resT = (bot.resT === undefined ? 200 : bot.resT) - dt;
  if (bot.resT <= 0) {
    bot.resT = 90;

function botSpend(bot) {

    ['fireGroup', t > 60 ? 2 : 0], ['mavic', (recon < 3 ? 1 : 0) * hasOp], ['fwRecon', (recon < 3 && t > 90 ? 0.7 : 0) * hasOp], ['interceptor', (t > 150 ? 1.5 : 0) * hasOp], ['bomber', (t > 240 ? 1.5 : 0) * hasOp],

    ['jammer', t > 120 ? 1.5 : 0], ['aa', t > 90 ? 1.5 : 0.7], ['ifv', t > 150 ? 1.2 : 0], ['tank', t > 300 ? 0.7 : 0],

function placementError(type, x, y) {

function handleCamera(dt) {
  if (!running) return;
  const sp = 560 * dt / cam.z;
  if (keys.ArrowLeft || keys.KeyA) cam.x -= sp; if (keys.ArrowRight || keys.KeyD) cam.x += sp;
  if (keys.ArrowUp || keys.KeyW) cam.y -= sp; if (keys.ArrowDown || keys.KeyS) cam.y += sp;
  if (mouse.inside && !drag && !pan) {
    const m = 26;
    if (mouse.x < m) cam.x -= sp; if (mouse.x > vw - m) cam.x += sp;
    if (mouse.y < m) cam.y -= sp; if (mouse.y > vh - m) cam.y += sp;
  }
  clampCam();
}

  const f = fac[0];

  f.queue.forEach((type, i) => {
    const d = UNITS[type];
    const b = el('div', 'q', d.label[PL][0]); b.title = d.label[PL] + '. Click to cancel and refund.';
    if (i === 0) { const bar = el('i'); bar.style.width = clamp(f.progress / d.time * 100, 0, 100).toFixed(0) + '%'; b.appendChild(bar); }
    b.addEventListener('click', () => cancelQueued(f, i));

}

// ---------------------------------------------------------------- rendering
function shapePath(c, shape, r) {
  c.beginPath();
  switch (shape) {
    case 'circle': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'tri': c.moveTo(r * 1.1, 0); c.lineTo(-r * 0.9, r * 0.75); c.lineTo(-r * 0.5, 0); c.lineTo(-r * 0.9, -r * 0.75); c.closePath(); break;
    case 'diamond': c.moveTo(r * 1.1, 0); c.lineTo(0, r * 0.65); c.lineTo(-r * 1.1, 0); c.lineTo(0, -r * 0.65); c.closePath(); break;
    case 'hex': for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; if (i) c.lineTo(Math.cos(a) * r, Math.sin(a) * r); else c.moveTo(r, 0); } c.closePath(); break;
    case 'rect': c.rect(-r, -r * 0.62, r * 2, r * 1.24); break;
    case 'rrect': c.roundRect ? c.roundRect(-r, -r * 0.6, r * 2, r * 1.2, 4) : c.rect(-r, -r * 0.6, r * 2, r * 1.2); break;
    case 'cross': c.rect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6); break;
    case 'ring': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'pent': for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; if (i) c.lineTo(Math.cos(a) * r, Math.sin(a) * r); else c.moveTo(r, 0); } c.closePath(); break;
    case 'wedge': c.moveTo(-r, -r * 0.7); c.lineTo(r * 0.7, -r * 0.45); c.lineTo(r * 0.7, r * 0.45); c.lineTo(-r, r * 0.7); c.closePath(); break;
    case 'dart': c.moveTo(r * 1.4, 0); c.lineTo(-r * 0.5, r * 0.55); c.lineTo(-r * 0.95, 0); c.lineTo(-r * 0.5, -r * 0.55); c.closePath(); break;
    case 'star': for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 === 0 ? r * 1.2 : r * 0.45; if (i) c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else c.moveTo(rr, 0); } c.closePath(); break;
    case 'tritail': c.moveTo(r * 1.1, 0); c.lineTo(-r * 0.9, r * 0.75); c.lineTo(-r * 0.5, 0); c.lineTo(-r * 0.9, -r * 0.75); c.closePath(); break;
    case 'gun': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'moto': c.roundRect ? c.roundRect(-r * 1.1, -r * 0.45, r * 2.2, r * 0.9, 4) : c.rect(-r * 1.1, -r * 0.45, r * 2.2, r * 0.9); break;
    case 'truck': c.rect(-r, -r * 0.55, r * 2, r * 1.1); break;
    case 'band': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'dprk': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'merc': c.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'plane': c.moveTo(r * 1.3, 0); c.lineTo(r * 0.3, r * 0.25); c.lineTo(-r * 0.1, r * 1.1); c.lineTo(-r * 0.45, r * 1.1); c.lineTo(-r * 0.35, r * 0.25);
      c.lineTo(-r * 1.1, r * 0.2); c.lineTo(-r * 1.3, r * 0.55); c.lineTo(-r * 1.4, 0); c.lineTo(-r * 1.3, -r * 0.55); c.lineTo(-r * 1.1, -r * 0.2); c.lineTo(-r * 0.35, -r * 0.25);
      c.lineTo(-r * 0.45, -r * 1.1); c.lineTo(-r * 0.1, -r * 1.1); c.lineTo(r * 0.3, -r * 0.25); c.closePath(); break;
    case 'car': c.roundRect ? c.roundRect(-r, -r * 0.5, r * 2, r, 3) : c.rect(-r, -r * 0.5, r * 2, r); break;

}
function shapeDetail(c, shape, r, stroke) {

function drawEffects(c) {
  for (const e of effects) {
    const k = e.t / e.dur;
    if (e.kind === 'boom') {
      const rr = e.r * (0.3 + 0.7 * Math.min(1, k * 1.6));
      c.globalAlpha = 1 - k;
      const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, rr);
      g.addColorStop(0, 'rgba(255,240,180,0.95)'); g.addColorStop(0.4, 'rgba(255,140,40,0.8)'); g.addColorStop(1, 'rgba(60,40,20,0)');

function drawProjectiles(c) {
  for (const p of projectiles) {
    const k = Math.min(1, p.t / p.dur), h = Math.sin(k * Math.PI) * p.arc;

      c.strokeStyle = 'rgba(255,200,120,0.6)'; c.lineWidth = 2;
      const bk = Math.max(0, k - 0.08), bx = p.sx + (p.tx - p.sx) * bk, by = p.sy + (p.ty - p.sy) * bk - Math.sin(bk * Math.PI) * p.arc;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(p.x, p.y - h); c.stroke();
    }
    c.fillStyle = '#f5e9c8'; c.beginPath(); c.arc(p.x, p.y - h, p.rocket ? 2.2 : 3, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.arc(p.x, p.y, 2, 0, Math.PI * 2); c.fill();
