function drawFog() {
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, vw, vh);
  fctx.fillStyle = 'rgba(8,10,6,0.6)'; fctx.fillRect(0, 0, vw, Math.min(vh, (H_LAND - cam.y) * cam.z));
  fctx.globalCompositeOperation = 'destination-out';
  const z = cam.z;
  for (const v of vision[PL]) {
    const x = (v.x - cam.x) * z, y = (v.y - cam.y) * z, r = v.r * z;
    if (x + r < 0 || y + r < 0 || x - r > vw || y - r > vh) continue;
    const g = fctx.createRadialGradient(x, y, r * 0.72, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = g; fctx.beginPath(); fctx.arc(x, y, r, 0, Math.PI * 2); fctx.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fogCanvas, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#1e2419'; ctx.fillRect(0, 0, vw, vh);
  if (!running) return;
  ctx.save(); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  ctx.drawImage(terrain, 0, 0);
  if (basemap && basemapTiles > 0) {
    ctx.drawImage(basemap, 0, 0);
    poly(ctx, BORDER, false); ctx.strokeStyle = 'rgba(193,18,31,0.85)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.stroke(); ctx.setLineDash([]);
    drawPipelines(ctx);
  }
  for (const rs of resources) drawResource(ctx, rs);
  for (const d of depots) drawDepot(ctx, d);
  for (const s of structs) drawStruct(ctx, s);
  // rally lines
  for (const s of selection) if (s.isStruct && s.def.produces && !s.dead) {
    ctx.strokeStyle = 'rgba(255,214,10,0.7)'; ctx.setLineDash([5, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.rally.x, s.rally.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(s.rally.x, s.rally.y, 5, 0, Math.PI * 2); ctx.stroke();
  }
  for (const u of units) if (!u.def.air && (u.seenBy[PL] || u.team === PL)) drawUnit(ctx, u);
  drawProjectiles(ctx);
  for (const u of units) if (u.def.air && u.seenBy[PL]) drawUnit(ctx, u);
  drawEffects(ctx);
  ctx.restore();

  drawFog();

  ctx.save(); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  for (const e of selection) {
    if (e.dead) continue;
    const r = rOf(e) + 5;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
    if (e.isUnit) hpBar(ctx, e.x - 12, e.y - r - 8, 24, e.hp / e.def.hp);
    const rng = e.isUnit ? rangeOf(e) : (e.def.range || 0);
    const jam = e.def.jam || 0;
    if (rng > 100 || jam) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.setLineDash([4, 6]);
      if (rng > 100) { ctx.beginPath(); ctx.arc(e.x, e.y, rng, 0, Math.PI * 2); ctx.stroke(); }
      if (e.isUnit && e.def.minRange) { ctx.beginPath(); ctx.arc(e.x, e.y, e.def.minRange, 0, Math.PI * 2); ctx.stroke(); }
      if (jam) { ctx.strokeStyle = 'rgba(196,139,224,0.6)'; ctx.beginPath(); ctx.arc(e.x, e.y, jam, 0, Math.PI * 2); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  for (const e of selection) {
    if (!e.isUnit || e.dead) continue;
    if (e.path && e.path.length && e.order.kind === 'move') { ctx.strokeStyle = 'rgba(232,228,212,0.45)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(e.x, e.y); for (const w of e.path) ctx.lineTo(w.x, w.y); ctx.lineTo(e.order.x, e.order.y); ctx.stroke(); ctx.setLineDash([]); }
    if (e.def.operated && e.operator && !e.operator.dead) { ctx.strokeStyle = 'rgba(159,214,232,0.5)'; ctx.setLineDash([3, 6]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.operator.x, e.operator.y); ctx.stroke(); ctx.setLineDash([]); }
    if (e.def.operator && needsOperator(UNITS.fpv, PL)) {
      ctx.strokeStyle = 'rgba(159,214,232,0.35)'; ctx.setLineDash([4, 8]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(e.x, e.y, 650 + (upgrades[PL].auto1 ? 150 : 0), 0, Math.PI * 2); ctx.stroke();
      for (const dr of (e.drones || [])) if (!dr.dead) { ctx.setLineDash([3, 6]); ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(dr.x, dr.y); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  for (const e of selection) if (e.isUnit && !e.dead && e.order.kind === 'bombard') {
    ctx.strokeStyle = 'rgba(255,107,107,0.8)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.order.x, e.order.y, (e.def.splash || 30) * (inVision(PL, e.order.x, e.order.y) ? 1 : 2.4), 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(e.order.x - 10, e.order.y); ctx.lineTo(e.order.x + 10, e.order.y); ctx.moveTo(e.order.x, e.order.y - 10); ctx.lineTo(e.order.x, e.order.y + 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.order.x, e.order.y); ctx.stroke(); ctx.setLineDash([]);
  }
  if (bombardMode && mouse.inside) { const w = toWorld(mouse.x, mouse.y); ctx.strokeStyle = '#ff6b6b'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(w.x, w.y, 40, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  if (tutorial.active && tutorial.marker) {
    const m = tutorial.marker, pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.strokeStyle = 'rgba(255,214,10,' + (0.4 + 0.5 * pulse) + ')'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r + pulse * 10, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const sw of swarms) {
    const ms = sw.members.filter(m => !m.dead); if (ms.length < 2) continue;
    const cx = ms.reduce((a, u) => a + u.x, 0) / ms.length, cy = ms.reduce((a, u) => a + u.y, 0) / ms.length;
    const rr = Math.max(...ms.map(m => Math.hypot(m.x - cx, m.y - cy))) + 16;
    ctx.strokeStyle = 'rgba(58,134,255,0.55)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,228,212,0.85)'; ctx.font = '11px Barlow, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('swarm ' + ms.length, cx, cy - rr - 4);
  }
  for (const u of units) if (u.team === PL && u.def.endurance && !u.landed && u.batt !== undefined && u.batt < u.def.endurance * 0.4) { const k = clamp(u.batt / u.def.endurance, 0, 1); ctx.fillStyle = '#000'; ctx.fillRect(u.x - 8, u.y + u.def.r + 4, 16, 3); ctx.fillStyle = k < 0.15 ? '#e04040' : '#e0a030'; ctx.fillRect(u.x - 8, u.y + u.def.r + 4, 16 * k, 3); }
  for (const u of units) if (u.team === PL && u.def.morale && u.morale !== undefined) { ctx.fillStyle = '#000'; ctx.fillRect(u.x - 10, u.y - u.def.r - 4, 20, 3); ctx.fillStyle = u.morale < 30 ? '#e04040' : '#ffd60a'; ctx.fillRect(u.x - 10, u.y - u.def.r - 4, 20 * u.morale / 100, 3); }
  for (const u of units) if (u.team === PL && u.hp < u.def.hp && !selection.includes(u)) hpBar(ctx, u.x - 10, u.y - u.def.r - 9, 20, u.hp / u.def.hp);
  for (const u of units) if (u.team === EN && u.seenBy[PL] && u.hp < u.def.hp) hpBar(ctx, u.x - 10, u.y - u.def.r - 9, 20, u.hp / u.def.hp);
  // jammer radius for own jam sources
  for (const s of structs) if (s.team === PL && s.def.jam && s.build >= 1) { ctx.strokeStyle = 'rgba(196,139,224,0.35)'; ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.arc(s.x, s.y, s.def.jam, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  for (const st of structs) if (!st.dead && st.def.heal && st.build >= 1 && (st.civ ? st.nation === PL : st.team === PL)) { ctx.strokeStyle = 'rgba(139,195,74,0.35)'; ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.arc(st.x, st.y, st.def.heal, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  for (const u of units) if (u.team === PL && u.def.jam) { ctx.strokeStyle = 'rgba(196,139,224,0.3)'; ctx.setLineDash([3, 7]); ctx.beginPath(); ctx.arc(u.x, u.y, u.def.jam, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
  // placement ghost
  if (placing && mouse.inside) {
    const w = toWorld(mouse.x, mouse.y), def = STRUCTS[placing];
    const hq = structs.find(s => s.team === PL && s.type === 'hq');
    if (hq) { ctx.strokeStyle = 'rgba(255,214,10,0.35)'; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(hq.x, hq.y, BUILD_RADIUS, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    for (const d of depots) if (d.owner === PL) { ctx.strokeStyle = 'rgba(255,214,10,0.35)'; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.arc(d.x, d.y, TOWN_BUILD_RADIUS, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (def.netR) { ctx.setLineDash([4, 6]); ctx.strokeStyle = '#e6e2cd'; ctx.beginPath(); ctx.arc(w.x, w.y, def.netR, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (def.heal) { ctx.setLineDash([4, 6]); ctx.strokeStyle = '#8bc34a'; ctx.beginPath(); ctx.arc(w.x, w.y, def.heal, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    const err = placementError(placing, w.x, w.y);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = err ? '#c1121f' : '#3a86ff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(w.x, w.y, def.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (def.range) { ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(w.x, w.y, def.range, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (def.jam) { ctx.setLineDash([4, 6]); ctx.strokeStyle = '#c48be0'; ctx.beginPath(); ctx.arc(w.x, w.y, def.jam, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = '12px Barlow, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(err || def.label, w.x, w.y + def.r + 16);
  }
  ctx.restore();

  // north arrow and scale bar
  ctx.save();
  ctx.font = '600 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(232,228,212,0.9)'; ctx.strokeStyle = 'rgba(232,228,212,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(26, 46); ctx.lineTo(26, 22); ctx.moveTo(19, 30); ctx.lineTo(26, 22); ctx.lineTo(33, 30); ctx.stroke();
  ctx.fillText('N', 26, 56);
  const bar = 10 * PX_PER_KM * cam.z;
  ctx.beginPath(); ctx.moveTo(52, 44); ctx.lineTo(52 + bar, 44); ctx.moveTo(52, 39); ctx.lineTo(52, 49); ctx.moveTo(52 + bar, 39); ctx.lineTo(52 + bar, 49); ctx.stroke();
  ctx.fillText('10 km', 52 + bar / 2, 56);
  ctx.textAlign = 'left'; ctx.fillText('zoom ' + cam.z.toFixed(1) + 'x', 52 + bar + 14, 44);
  if (basemap) { ctx.font = '11px Barlow, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(232,228,212,0.85)'; ctx.fillText(TILE_SRC[basemapMode].attrib + (basemapTiles < basemapTotal ? ' (' + basemapTiles + '/' + basemapTotal + ' tiles)' : ''), 10, vh - 8); }
  ctx.restore();

  if (drag) {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    const x = (Math.min(drag.x0, drag.x1) - cam.x) * cam.z, y = (Math.min(drag.y0, drag.y1) - cam.y) * cam.z;
    ctx.fillRect(x, y, Math.abs(drag.x1 - drag.x0) * cam.z, Math.abs(drag.y1 - drag.y0) * cam.z);
    ctx.strokeRect(x, y, Math.abs(drag.x1 - drag.x0) * cam.z, Math.abs(drag.y1 - drag.y0) * cam.z);
  }
  renderMinimap();
  updateHUD();
}

function renderMinimap() {
  mmctx.setTransform(1, 0, 0, 1, 0, 0);
  mmctx.drawImage(mmTerrain, 0, 0);
  const sx = MM_W / W, sy = MM_H / H;
  mmctx.fillStyle = 'rgba(0,0,0,0.3)'; mmctx.fillRect(0, 0, MM_W, MM_H);
  for (const d of depots) { mmctx.fillStyle = d.owner === UA ? TEAMS[UA].color : d.owner === RU ? TEAMS[RU].color : '#c8c4b0'; mmctx.fillRect(d.x * sx - 3, d.y * sy - 3, 6, 6); }
  for (const rs of resources) { mmctx.fillStyle = rs.burnT > 0 ? '#e0552b' : rs.owner === UA ? TEAMS[UA].color : rs.owner === RU ? TEAMS[RU].color : '#c8c4b0'; mmctx.beginPath(); mmctx.arc(rs.x * sx, rs.y * sy, 3, 0, Math.PI * 2); mmctx.fill(); }
  for (const s of structs) { mmctx.fillStyle = s.civ ? '#e8e2cc' : TEAMS[s.team].color; mmctx.fillRect(s.x * sx - 2, s.y * sy - 2, s.civ ? 3 : 5, s.civ ? 3 : 5); }
  for (const u of units) if (u.seenBy[PL] || u.team === PL) { mmctx.fillStyle = u.team === UA ? '#9cc4ff' : u.team < 0 ? '#e8e2cc' : '#ff7a7a'; mmctx.fillRect(u.x * sx - 1, u.y * sy - 1, 2, 2); }
  // fog of war on the minimap: only what your side can see is lit
  mmFogCtx.globalCompositeOperation = 'source-over'; mmFogCtx.clearRect(0, 0, MM_W, MM_H);
  mmFogCtx.fillStyle = 'rgba(4,6,3,0.62)'; mmFogCtx.fillRect(0, 0, MM_W, H_LAND * sy);
  mmFogCtx.globalCompositeOperation = 'destination-out';
  for (const v of vision[PL]) { mmFogCtx.beginPath(); mmFogCtx.arc(v.x * sx, v.y * sy, Math.max(2, v.r * sx), 0, Math.PI * 2); mmFogCtx.fill(); }
  mmctx.drawImage(mmFog, 0, 0);
  mmctx.strokeStyle = '#fff'; mmctx.lineWidth = 1;
  mmctx.strokeRect(cam.x * sx + 0.5, cam.y * sy + 0.5, vw / cam.z * sx, vh / cam.z * sy);
}

function drawLegend(cv) {
  const list = ['fpv', 'fiberFpv', 'mavic', 'fwRecon', 'interceptor', 'bomber', 'liutyi', 'lancet', 'molniya', 'geran', 'geran3', 'gerbera', 'infantry', 'fireGroup', 'moto', 'merc', 'dprk', 'defector', 'truck', 'civcar', 'tank', 'ifv', 'aa', 'jammer', 'howitzer', 'mlrs'];
  const cw = cv.clientWidth || 640, ch = cv.clientHeight || 150, d = window.devicePixelRatio || 1;
  cv.width = cw * d; cv.height = ch * d;
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  c.clearRect(0, 0, cw, ch);
  const cols = cw > 420 ? 4 : 2, cellW = cw / cols, cellH = Math.max(22, ch / Math.ceil(list.length / cols));
  list.forEach((k, i) => {
    const def = UNITS[k], x = (i % cols) * cellW, y = Math.floor(i / cols) * cellH;
    c.save(); c.translate(x + 18, y + cellH / 2);
    const enemy = def.side === 1, neutral = k === 'civcar';
    shapePath(c, def.shape, def.r); c.fillStyle = def.hollow ? 'rgba(90,20,24,0.5)' : neutral ? '#efeadf' : enemy ? TEAMS[RU].color : TEAMS[UA].color; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = neutral ? '#5d584c' : enemy ? TEAMS[RU].stroke : TEAMS[UA].stroke; c.stroke();
    shapeDetail(c, def.shape, def.r, neutral ? '#5d584c' : enemy ? TEAMS[RU].stroke : TEAMS[UA].stroke);
    if (k === 'defector') { c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, def.r * 0.62, 0, Math.PI * 2); c.stroke(); }
    c.restore();
    c.fillStyle = '#e8e4d4'; c.font = '13px Barlow, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText((enemy ? def.label[RU] : def.label[UA]) + (enemy ? ' (enemy)' : neutral ? ' (neutral)' : ''), x + 42, y + cellH / 2);
  });
}

// ---------------------------------------------------------------- overlays
function showIntro() {
  const o = document.getElementById('overlay'); o.style.display = 'flex'; o.textContent = '';
  const card = el('div', 'card');
  const h1 = el('h1'); h1.append('Grey ', Object.assign(el('span'), { textContent: 'Zone' })); card.appendChild(h1);
  card.appendChild(el('p', 'sub', 'A browser RTS set on the Kharkiv to Belgorod axis. You command Ukrainian forces from Kharkiv in the south. Build factories, buy weapons, take the towns along the state border, and destroy the Russian headquarters in Belgorod to the north.'));
  const cols = el('div', 'cols');
  const a = el('div');
  a.appendChild(el('h2', null, 'How it works'));
  a.appendChild(el('p', null, 'Either side is playable. As Russia you get autonomous drones, Lancets, Molniyas, and Geran waves, no civilian penalties, and a Ukrainian opponent that bleeds you with defections; as Ukraine the reverse. Drone works and launch sites now turn out drones in under a second, but each one adds heat; at 100% the works overheats and the backlog waits until it cools below 35%. Ground units take far longer, 12 seconds for a squad and half a minute for a tank. Every 75 seconds a trade convoy leaves your headquarters for the border (west to NATO for Ukraine, east into Russia for Russia) carrying grain and gas worth more the more sites you hold; when it crosses you are paid and a truck of supplies comes back. Any truck, yours or theirs, is captured by an enemy squad standing over it with no escort nearby, and drives its cargo to the captor\'s headquarters.'));
  a.appendChild(el('p', null, 'Artillery can fire blind. Select guns and Ctrl+right-click a spot, or press B and click, and they shell that point until you give them another order, moving into range first if they need to. Unobserved fire scatters two and a half times wider than fire with a drone or squad watching the target, and whatever is under the shells is hit, civilians included. Guns on a fire mission still switch to any enemy unit that shows itself in range. The enemy does the same to your pumping stations, buildings, and towns.'));
  a.appendChild(el('p', null, 'Drones are hard to kill now: more health across the board, and every drone dodges a share of the shots fired at it (an FPV 35%, a Sting 40%, a Vampire 15%), so air defense needs volume and the right research. Research is a tree of seven branches with three tiers each, opened with T or from the Procurement tab: Drones (who flies them), Airframes (health, evasion, cameras), Links (reach and jamming resistance), Air defense (range, gunnery, jammers), Ground (cages, ammunition, shells), People (recruits, medevac, mobilization), Economy (logistics, satellite feeds, aid). Each tier needs the one before it. The enemy researches on its own timetable.'));
  a.appendChild(el('p', null, 'Some troops have morale. Russia can bring up to ten squads of North Korean infantry, tough and well drilled and outside its own manpower pool, and both sides can hire up to six squads of foreign fighters (the International Legion for Ukraine, mercenary assault squads for Russia) that fight better than regulars but draw wages of 2 funds a second. Morale rises while their side holds more towns than the enemy and near a headquarters or hospital; it falls when their side is losing, under fire, when a friend dies nearby, and for mercenaries when the wages are not paid. Low morale means weaker fire and slower feet; below 30% a squad falls back and ignores orders; at 0% North Koreans break and mercenaries walk away. The yellow bar under a squad is its morale.'));
  a.appendChild(el('p', null, 'Hospitals heal. Troops standing near an intact hospital of their own side recover 6% of their health a second; near a Field hospital you build (350, place it in a wood behind the line) 4% a second. Lose the hospital and the healing stops, which is one more reason to keep the drones off it.'));
  a.appendChild(el('p', null, 'Drones are very cheap now: an FPV is 25 funds, a Sting 35, a Mavic 40, a fiber FPV 45, a Vampire 120. Drones are the cheapest thing you can build and should be most of your army, and they are the real ones. Quads come from the drone works: FPVs, fiber-optic FPVs, Mavic recon, Sting interceptors, and the Vampire heavy bomber the Russians call Baba Yaga. Fixed-wing aircraft come from the launch site: the Shark spotter plane and the Liutyi strike drone. The enemy flies Orlan-10 spotters, Lancets that hunt your artillery and air defense, Molniya fixed-wing FPVs, and Geran-2 waves with Gerbera decoys. Hover any unit button to read what it is.'));
  a.appendChild(el('p', null, 'Buildings do not shoot. Air defense is fire groups, mobile air defense, and interceptors; a radar post only sees. Who can hit what is fixed: infantry and IFVs shoot at troops, tanks fire only at vehicles and buildings and cannot engage drones, artillery and bombers hit anything on the ground, fire groups and air defense hit only drones. The selection panel lists what each unit can hit.'));
  a.appendChild(el('p', null, 'Drones have flight time: an FPV about two and a half minutes, a Mavic four, a Vampire just over three, the fixed wings ten. When a drone drops to a quarter charge it flies home to its squad, or to the nearest drone works, launch site, or headquarters if it is autonomous, lands, and takes off again half a minute to a minute later. A drone that runs flat before it gets home crashes. A kamikaze that is already diving finishes the dive. Fiber-optic FPVs are always tethered to a squad, on both sides, even after Full autonomy.'));
  a.appendChild(el('p', null, 'Drones run on electricity. The quads and the Lancet and Molniya fly on batteries: an FPV has about 70 seconds of flight, a Mavic 110, a Vampire 160, and any drone that is not on a one-way dive lands beside its squad to swap batteries when the charge runs low, which takes 25 to 60 seconds. Charging capacity comes from the grid: your base generators charge 24 drones, each intact substation of your nation 30 more, and each Generator set you build 15. Lose the substation to a Geran (they go for the grid first) and recharging takes three times as long and no new battery drones can be built. The Shark, Orlan, and Liutyi have gasoline engines and draw on the fuel supply like vehicles. The Geran-3 that joins the later waves is a turbojet, twice as fast.'));
  a.appendChild(el('p', null, 'Supply comes from the land. Every squad eats: your stores feed four, and each wheat field you hold feeds six more. Every vehicle burns fuel: reserves cover three, and each gas site with an intact pipeline fuels six more. Go over the food line and your troops fight and heal weaker, recruits stop coming, and morale slides; go over the fuel line and your vehicles crawl and you cannot build another one until you take more gas or repair the pipeline. The top bar shows both counts; the enemy runs on the same rules and goes after whichever it is short of.'));
  a.appendChild(el('p', null, 'Gas and grain are on the map too. Two gas well sites south of Kharkiv pay 5 funds a second each, but only while every pumping station on the pipeline to your headquarters is standing; the enemy raids the pumps with drones, repair crews rebuild one about two minutes after the area goes quiet, and the enemy has the Belgorod fuel depot fed from the north. Wheat fields, two on your side and two on theirs plus one contested, send a grain truck to your headquarters every 40 seconds, worth 3 recruits, 2 support, and 30 funds on arrival; gas sites send an oil tanker worth 120 funds on top of the pipeline flow. Trucks die in the kill zone like anything else. Heavy fire on a field sets it burning for a minute and stops its trucks. Both kinds are captured by infantry like towns.'));
  a.appendChild(el('p', null, 'Supply trucks carry funds from your headquarters to each town you hold. The ground either side of the border is a kill zone: anything that moves there gets hunted. Nets over the route and fire groups beside it keep the trucks alive. You can build near your headquarters or near any town you hold.'));
  a.appendChild(el('p', null, 'The enemy fights the way it does on the real front: motorcycle assault groups rushing towns, Lancets hunting vehicles and trucks, heavy jamming, and long-range drone waves padded with decoys to soak up your air defense. Fiber-optic FPVs are the answer to jamming; cages are the answer to FPVs.'));
  a.appendChild(el('p', null, 'Civilians are on the map: apartment blocks, hospitals, schools, substations, and the cars moving between them, on both sides of the border. Enemy long-range drones go after Ukrainian civilian sites, and every one you lose cuts your income. Your own strikes that hit Russian civilian sites or vehicles cost funds and international support, and support scales your income. Keep it above 70% and hold ground on the Russian side and Russian volunteers will join you; isolated Russian squads near your lines will also surrender.'));
  a.appendChild(el('p', null, 'Every unit needs people. A tank ties up a crew of three, a howitzer four, an infantry squad six. Drones are flown by infantry squads on the map: each drone is linked to a squad and must stay within that squad\'s control range (650 for quads, 500 for fiber, 1400 for fixed wings). You can build more drones than your squads can fly; the extras sit grounded at the works, dimmed with a red ring, and take off on their own the moment a squad within reach has a free slot. A drone whose squad dies lands where it is and waits the same way. Until you research Drone swarm control a squad flies one drone; then four; Full autonomy frees them entirely. The Russian side is automated from the start: its drones need no squads and have no control range, which is the gap your research closes. Move your squads forward with their drones, and keep them alive. When a vehicle or squad is lost, half its people are gone; recruits trickle in, faster with a training center, towns, and wheat.'));
  a.appendChild(el('p', null, 'Drones are the fastest things on the map; nothing on the ground outruns even a heavy bomber. Ordered together they fly in formation (wedge, line, column, or ring, chosen in the selection panel). Press G to bind the selected drones into a swarm: it keeps formation on its own, clicking one drone selects the whole swarm, and a strike order spreads its kamikazes across every target around the point instead of piling onto one. Swarm size is limited by your automation tier: 6, 12, 24, then 48.'));
  a.appendChild(el('p', null, 'Ground units prefer roads. A move order is routed along the road network whenever that is not slower than going straight, the dashed line on a selected unit shows the route, and on a road everything moves faster: motorcycles and trucks 80% faster, IFVs and fire groups 50%, infantry 30%, tanks 25%. The same is true of the enemy, whose columns now come up the roads, which is where the drones wait for them.'));
  a.appendChild(el('p', null, 'Troops can dig in: select them and press E, and after 20 seconds standing still they leave a trench. Anyone in a trench takes 45% less damage, 70% less from drones, and is seen only from within 110, anywhere on the map. Trenches can be shelled flat. The enemy digs in wherever its troops stand for a while, so expect its towns to be fortified. The Manual button in the top bar (or M) has every unit, building, and a strategy guide.'));
  a.appendChild(el('p', null, 'Ground matters for troops. In forest (the dark tree clusters) infantry, fire groups, and motorcycle groups hit 50% harder, take 40% less damage, take 60% less from drones under the canopy, and cannot be seen unless an enemy comes within 140. Towns give a smaller version of the same. In open fields they take 30% more damage from everything. Rivers and reservoirs stop ground units: they cross only at bridges, marked where roads, the railway, and riverside towns meet the water, and a blocked unit walks to the nearest bridge on its own.'));
  a.appendChild(el('p', null, 'Kamikaze drones (the red dot on the nose): FPVs, fiber FPVs, Molniya, Lancet, Liutyi, Geran. They fly into their target and are gone. Everything else flies home.'));
  a.appendChild(el('p', null, 'Toggle the Map button in the top bar to lay real street-map or satellite tiles under the game. If they do not appear in this preview, that is the preview blocking outside images; opening the file in a browser tab loads them.'));
  a.appendChild(el('p', null, 'The map is a true Web Mercator projection of the region, so the street and satellite tile layers sit exactly under the game grid. Geran waves still come from the north, the east, and up from the south where the Azov coast launch sites are, well off the map.'));
  a.appendChild(el('p', null, 'The map follows real geography at roughly 18 pixels per kilometer, Kupiansk to Grayvoron and Chuhuiv to Belgorod: the Siverskyi Donets, Lopan, and Udy rivers, the two reservoirs, the highway and railway between the cities, and the state border between Kharkiv and Belgorod oblasts.'));
  const b = el('div');
  b.appendChild(el('h2', null, 'Controls'));
  const ul = el('ul');
  for (const [k, v] of [['Left-drag', 'select units'], ['Right-click', 'move, attack, or set a factory rally point'], ['Z X C V B', 'produce from the selected factory'],
    ['F', 'selected kamikaze drones dive at the nearest target they can see; a swarm spreads its dives over everything around it'], ['Ctrl+right-click, or B then click', 'artillery fires on a map point, seen or unseen'], ['E', 'selected troops dig a trench where they stand'], ['M', 'open the field manual: every unit, building, and the strategy'], ['T', 'open the research tree'], ['Double-click', 'select every drone on screen; double-click a drone to select all of that type'], ['G', 'form the selected drones into a swarm, or disband one'], ['Ctrl+1 to 5', 'assign a group, digit to recall'], ['W A S D, arrow keys, screen edge, minimap', 'move the camera'], ['Mouse wheel, + and -', 'zoom'], ['Space', 'jump to headquarters'], ['P', 'pause'], ['Esc', 'cancel or deselect']]) {
    const li = el('li'); const kb = el('kbd', null, k); li.appendChild(kb); li.append(' ' + v); ul.appendChild(li);
  }
  b.appendChild(ul);
  cols.append(a, b); card.appendChild(cols);
  card.appendChild(el('h2', null, 'Unit shapes')).style.marginTop = '18px';
  const lg = el('canvas'); lg.id = 'legend'; card.appendChild(lg);
  const sideRow = el('div'); sideRow.id = 'diff'; sideRow.style.marginTop = '14px';
  sideRow.appendChild(el('span', null, 'Play as'));
  let side = UA;
  const sideBtns = [['Ukraine', UA], ['Russia', RU]].map(([label, v]) => { const bt = el('button', v === UA ? 'on' : '', label); bt.type = 'button'; bt.addEventListener('click', () => { side = v; sideBtns.forEach(x => x.classList.remove('on')); bt.classList.add('on'); }); sideRow.appendChild(bt); return bt; });
  card.appendChild(sideRow);
  const diff = el('div'); diff.id = 'diff'; diff.style.marginTop = '8px';
  diff.appendChild(el('span', null, 'Enemy strength'));
  let chosen = 0.7;
  const btns = [['Easy', 0.5], ['Normal', 0.7], ['Hard', 0.95]].map(([label, v]) => {
    const bt = el('button', v === 0.7 ? 'on' : '', label); bt.type = 'button';
    bt.addEventListener('click', () => { chosen = v; btns.forEach(x => x.classList.remove('on')); bt.classList.add('on'); });
    diff.appendChild(bt); return bt;
  });
  const mb = el('button', null, 'Field manual'); mb.type = 'button'; mb.title = 'Opens the full manual page (grey-zone-manual.html) in a new tab; if the tab is blocked, the same content opens in-game'; mb.addEventListener('click', () => { let w = null; try { w = window.open('grey-zone-manual.html', '_blank'); } catch (e) {} if (!w) toggleManual(); }); diff.appendChild(mb);
  const tb = el('button', null, 'Tutorial'); tb.type = 'button'; tb.title = 'A guided first game as Ukraine on Easy: 14 short steps, the enemy stays quiet until you have air defense'; tb.addEventListener('click', startTutorial); diff.appendChild(tb);
  const go = el('button', 'go', 'Start'); go.type = 'button'; go.addEventListener('click', () => startGame(chosen, side)); diff.appendChild(go);
  card.appendChild(diff);
  o.appendChild(card);
  requestAnimationFrame(() => drawLegend(lg));
}

function showResult(winner) {
  const o = document.getElementById('overlay'); o.style.display = 'flex'; o.textContent = '';
  const card = el('div', 'card');
  const h1 = el('h1', null, winner === PL ? 'Enemy headquarters destroyed' : 'Headquarters lost'); card.appendChild(h1);
  card.appendChild(el('p', 'result', winner === PL ? (PL === UA ? 'The line held and the counteroffensive reached the enemy command post.' : 'Russian forces reached the Kharkiv command post.') : PL === RU ? 'Ukrainian forces broke through and reached Belgorod.' : 'Russian forces broke through and reached your command post.'));
  const st = el('div', 'stats');
  const civTotal = CIV_SITES.filter(c => c[1] === 0).length;
  for (const [v, l] of [[fmtTime(gameTime), 'Time'], [stats.lost[EN], 'Enemy units destroyed'], [depots.filter(d => d.owner === PL).length + ' of ' + depots.length, 'Towns held'],
    [(civTotal - civ.lost[0]) + ' of ' + civTotal, 'Ukrainian civilian sites standing'], [civ.harmedByUA + civ.carsKilled[0], 'Russian civilian sites and vehicles you hit'], [civ.defectors, 'Russian volunteers and defectors'],
    [PL === UA ? Math.round(support) + '%' : captured[PL], PL === UA ? 'Support at the end' : 'Enemy trucks captured'], [resources.filter(r => r.owner === PL).length + ' of ' + resources.length, 'Gas and wheat sites held'], [tradeTotal[PL], 'Funds from trade convoys']]) {
    const d = el('div'); d.appendChild(el('b', null, String(v))); d.appendChild(el('span', null, l)); st.appendChild(d);
  }
  card.appendChild(st);
  const again = el('button', null, 'Play again'); again.type = 'button'; again.addEventListener('click', () => { running = false; showIntro(); });
  card.appendChild(again);
  o.appendChild(card);
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000); last = now;
  if (running && !paused && !gameOver) {
    acc += elapsed; let steps = 0;
    while (acc >= DT && steps < 5) { tick(DT); acc -= DT; steps++; }
    if (steps === 5) acc = 0;
  }
  handleCamera(elapsed);
  render();
  requestAnimationFrame(frame);
}
resize();
buildTerrain();
showIntro();
requestAnimationFrame(frame);
</script>
